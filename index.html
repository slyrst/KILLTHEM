function spawnEnemy(){
  // spawn at a random point just off-screen
  const side = Math.floor(Math.random()*4);
  let x,y;
  const margin = 80;
  if(side===0){ x = camera.x - margin; y = camera.y + Math.random()*canvas.height; }
  else if(side===1){ x = camera.x + canvas.width + margin; y = camera.y + Math.random()*canvas.height; }
  else if(side===2){ x = camera.x + Math.random()*canvas.width; y = camera.y - margin; }
  else { x = camera.x + Math.random()*canvas.width; y = camera.y + canvas.height + margin; }
  x = clamp(x, 20, WORLD.w-20); y = clamp(y, 20, WORLD.h-20);

  let type;
  if(currentStage === 2){
    const r = Math.random();
    type = r < 0.4 ? 'green' : (r < 0.7 ? 'glob' : 'knight');
  } else {
    type = Math.random() < 0.55 ? 'green' : 'glob';
  }

  if(type === 'green'){
    const hp = 60 * DIFF.enemyHpMult;
    enemies.push({
      type:'green', x, y, radius:24, hp, maxHp:hp, speed: 118 + waveDifficulty*4,
      state:'chase', stateTimer:0, dmg: 18,
      lungeFrom:{x:0,y:0}, lungeTo:{x:0,y:0},
      hitCooldown:0,
    });
  } else if(type === 'glob'){
    const hp = 40 * DIFF.enemyHpMult;
    enemies.push({
      type:'glob', x, y, radius:26, hp, maxHp:hp, speed: 70,
      state:'kite', fireTimer: 0.8 + Math.random()*0.5,
      preferredMin: 260, preferredMax: 420,
    });
  } else {
    // Knight: melee bruiser that dash-attacks the player and can parry
    // shots back at us with its sword before hopping away again.
    // Stage 2 bazen güçlendirilmiş Knight spawn eder: daha büyük, daha hızlı,
    // daha fazla hasarlı ve daha büyük kılıçlı.
    const buffed = currentStage === 2 && Math.random() < 0.18;
    const hp = (buffed ? 180 : 90) * DIFF.enemyHpMult;
    const radius = buffed ? 36 : 26;
    enemies.push({
      type:'knight', x, y, radius, hp, maxHp:hp,
      speed: (buffed ? 235 : 205) + waveDifficulty*5,
      state:'chase', stateTimer:0, dmg: buffed ? 48 : 24,
      dashFrom:{x:0,y:0}, dashTo:{x:0,y:0}, retreatDir:{x:0,y:0},
      hitCooldown:0, parryFlash:0,
      swordTimer:0.65 + Math.random()*0.55,
      swordCooldown: buffed ? 0.55 : 0.85, swordSwing:0,
      swordAngle:0,
      swordScale: buffed ? 1.65 : 1.35,
      buffed,
    });
  }
}

// Turns a normal green enemy into the MUTATED GREEN boss: massive HP (30x
// a normal green), a slow grow-in-place "awakening" animation with screen
// shake + a pulse ring, and afterwards it fires 5-orb bursts on top of its
// usual melee lunge.
function mutateToBoss(e){
  const GREEN_BASE_HP = 60;
  e.isBoss = true;
  e.bossName = 'MUTATED GREEN';
  e.maxHp = GREEN_BASE_HP * 30 * DIFF.bossHpMult;
  e.hp = e.maxHp;
  e.baseRadius = e.radius;
  e.targetRadius = e.baseRadius * 3.4;
  e.mutating = true;
  e.growTimer = 2.6;
  e.growDuration = 2.6;
  e.speed *= 0.8;              // bigger body, a touch slower

  // Kaçıncı boss çıkışı olduğunu say (50=1., 100=2., 150=3. ...) ve her
  // sonraki çıkışı bir öncekinin 2 katı zararlı yap (1x, 2x, 4x, 8x...).
  const bossNumber = Math.max(1, Math.round(nextBossThreshold / 100));
  const dangerMultiplier = Math.pow(2, bossNumber - 1);
  e.dangerMultiplier = dangerMultiplier;

  e.dmg = Math.round(e.dmg * 1.8 * dangerMultiplier);
  e.orbBurstTimer = 1.8;       // first burst shortly after it wakes up
  e.orbBurstRate = 2.6;

  bossEnemyRef = e;
  bossActive = true;

  screenShake.timer = e.growDuration;
  screenShake.duration = e.growDuration;
  screenShake.strength = 16;

  bossPulse.active = true;
  bossPulse.timer = e.growDuration;
  bossPulse.duration = e.growDuration;
  bossPulse.x = e.x;
  bossPulse.y = e.y;

  banner.text = 'MUTATION!';
  banner.timer = 1.4;
}

// Fires 5 yellow orbs at once in a spread aimed at the player.
function bossOrbBurst(e){
  const baseAng = Math.atan2(player.y - e.y, player.x - e.x);
  const count = 5;
  const totalSpread = 0.85;
  const dmg = 16 * (e.dangerMultiplier || 1);
  for(let i=0;i<count;i++){
    const t = (i/(count-1)) - 0.5; // -0.5 .. 0.5
    const ang = baseAng + t*totalSpread;
    orbs.push({
      x: e.x, y: e.y,
      vx: Math.cos(ang)*820, vy: Math.sin(ang)*820,
      dmg,
    });
  }
  screenShake.timer = Math.max(screenShake.timer, 0.22);
  screenShake.duration = Math.max(screenShake.duration, 0.22);
  screenShake.strength = Math.max(screenShake.strength, 6);
}

// Central kill handler. Every place an enemy's hp drops to 0 should call
// this instead of directly splicing it out of `enemies`, so the 50th-kill
// boss mutation can intercept a death and turn the enemy into the boss
// instead of letting it die normally. Returns true if the enemy actually
// died (caller should remove it from `enemies`), false if it mutated
// instead (caller should NOT remove it - it's still alive).
function registerKill(e, exploded){
  const willBeKillNum = player.totalKills + 1;

  // nextBossThreshold'a ulaşıldıktan sonra, mutasyonu SADECE bir GREEN
  // kill'i tetikleyebilir. Glob kill'i sayaç değerini artırır ama
  // tetiklemez; rastgele başka bir düşman asla boss'a çevrilmez - eşiği
  // geçtikten sonraki ilk green kill'i gelene kadar beklenir. Eşik her
  // tetiklemede +50 artar, böylece boss arasıra tekrar tekrar çıkar.
  if(!bossActive && currentStage===1 && willBeKillNum >= nextBossThreshold && e.type === 'green'){
    mutateToBoss(e);
    nextBossThreshold = Infinity;
    // Bu kill iptal - enemy ölmüyor, mutasyona giriyor.
    return false;
  }

  if(e === bossEnemyRef && !(currentStage===2 && e.type==='cubev2')){
    bossActive = false;
    bossEnemyRef = null;
  }

  if(e.type === 'cubev2'){
    if(e.isClone) cubeV2Clones = cubeV2Clones.filter(c=>c!==e);
    else cubeV2Ref = null;

    // Count the two clones + real Cube as one 3-part boss encounter.
    const remainingCubeBosses = enemies.filter(en => en!==e && en.type==='cubev2' && en.hp>0);
    bossActive = remainingCubeBosses.length>0;
    bossEnemyRef = remainingCubeBosses[0] || null;

    if(currentStage===2 && remainingCubeBosses.length===0 && !stage2BossFinished){
      stage2BossFinished = true;
      localStorage.setItem('kt_stage2_complete','1');
      banner.text = 'CUBE V2 DESTROYED'; banner.timer = 2.2;
      screenShake = { timer:1.2, duration:1.2, strength:18 };
      for(let n=0;n<30;n++) spawnExplosion(e.x+(Math.random()-.5)*300, e.y+(Math.random()-.5)*300, 1+Math.random()*1.6);
      setTimeout(() => { if(player.alive) showStageCompleteScreen(2); }, 900);
    }
  }

  // Point-blank kill: if the enemy died almost inside the player (barely
  // touching / overlapping), it's a close-range execution - give some HP
  // back, with a green heal pulse around the player.
  // "Yakın" burada iç içe girmiş olmayı değil, gerçekten yakın mesafeden
  // yapılan bir öldürmeyi ifade ediyor - o yüzden menzil bolca geniş.
  const closeRange = player.radius + e.radius + 120;
  if(dist(player.x, player.y, e.x, e.y) <= closeRange){
    healPlayer(15);
  }

  spawnCorpsePieces(e, exploded);
  player.killStreak++;
  player.totalKills++;
  showBanner();
  return true;
}

// ---------- UPDATE ----------
let lastTime = performance.now();
let banner = { text:'', timer:0 };

function update(dt){
  updateCubeDialogue(dt);
  if(!cubeDialogueActive && cubeV2Ref && player.alive){
    cubeV2Ref.tauntTimer -= dt;
    if(cubeV2Ref.tauntTimer <= 0){ cubeV2Taunt(); cubeV2Ref.tauntTimer = 5.5 + Math.random()*5.5; }
  }
  // Ölüm efektleri oyun dururken de çalışır.
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].timer -= dt;
    if(explosions[i].timer <= 0) explosions.splice(i,1);
  }

  if(screenShake.timer > 0) screenShake.timer -= dt;
  if(bossPulse.timer > 0){
    bossPulse.timer -= dt;
    if(bossPulse.timer <= 0) bossPulse.active = false;
  }
  if(healPulseTimer > 0) healPulseTimer -= dt;

  for(let i=deathPieces.length-1;i>=0;i--){
    const p = deathPieces[i];
    p.life -= dt;
    p.vy += 620*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.rot += p.vr*dt;
    p.alpha = Math.max(0,p.life/1.05);
    if(p.life <= 0) deathPieces.splice(i,1);
  }


  // Green ve Glob cesetleri AYNI fizik sistemini kullanır.
  // Normal ölümde kısa mesafe dağılır; explosion/parry ölümünde çok daha uzağa uçar.
  for(let i=corpsePieces.length-1;i>=0;i--){
    const p = corpsePieces[i];
    p.life -= dt;

    if(!p.settled){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;

      // Top-down oyun: parçaları ekranın altına "düşürmek" yerine sürtünmeyle öldüğü yerde oturt.
      const drag = p.exploded ? 0.62 : 0.18;
      p.vx *= Math.pow(drag, dt);
      p.vy *= Math.pow(drag, dt);
      p.vr *= Math.pow(0.11, dt);

      p.x = clamp(p.x, p.pieceW*0.5, WORLD.w-p.pieceW*0.5);
      p.y = clamp(p.y, p.pieceH*0.5, WORLD.h-p.pieceH*0.5);

      if(Math.hypot(p.vx,p.vy) < 8 && Math.abs(p.vr) < 0.25){
        p.vx = 0; p.vy = 0; p.vr = 0;
        p.settled = true;
      }
    } else if(player.alive){
      // Oyuncu yerdeki parçaları hafifçe itebilir.
      const dx = p.x-player.x, dy = p.y-player.y;
      const d = Math.hypot(dx,dy) || 0.001;
      const range = player.radius + Math.max(p.pieceW,p.pieceH)*0.7;
      if(d < range){
        const force = (1-d/range) * 420;
        p.vx += (dx/d) * force;
        p.vy += (dy/d) * force;
        p.vr += (Math.random()-0.5)*4;
        p.settled = false;
      }
    }

    p.alpha = p.life > 1 ? 1 : Math.max(0,p.life);
    if(p.life <= 0) corpsePieces.splice(i,1);
  }


  if(!player.alive) return;

  // Cinematic dialogue freezes combat, while the dialogue itself continues.
  if(cubeDialogueActive) return;

  // ----- player movement -----
  let mv = {x:0,y:0};
  if(autoPilot){
    mv = updateAutoPilot(dt);
  } else {
    if(keys['w']) mv.y -= 1;
    if(keys['s']) mv.y += 1;
    if(keys['a']) mv.x -= 1;
    if(keys['d']) mv.x += 1;
  }
  if(mv.x !== 0 || mv.y !== 0){
    const len = Math.hypot(mv.x, mv.y);
    mv.x/=len; mv.y/=len;
    player.lastDir = {x:mv.x, y:mv.y};
  }

  if(player.knockbackTime > 0){
    player.x += player.knockbackX*dt;
    player.y += player.knockbackY*dt;
    player.knockbackTime -= dt;
    if(player.knockbackTime <= 0){ player.knockbackTime=0; player.knockbackX=0; player.knockbackY=0; }
  } else if(player.dashing){
    player.dashTimer -= dt;
    player.x += player.lastDir.x * player.dashSpeed * dt;
    player.y += player.lastDir.y * player.dashSpeed * dt;
    if(player.dashTimer <= 0) player.dashing = false;
  } else {
    player.x += mv.x * player.speed * dt;
    player.y += mv.y * player.speed * dt;
  }
  player.x = clamp(player.x, player.radius, WORLD.w - player.radius);
  player.y = clamp(player.y, player.radius, WORLD.h - player.radius);

  if(player.dashCooldown > 0) player.dashCooldown -= dt;
  if(player.invuln > 0) player.invuln -= dt;
  if(player.fireCooldown > 0) player.fireCooldown -= dt;
  if(parryCooldown > 0) parryCooldown -= dt;
  if(parryPulseTimer > 0) parryPulseTimer -= dt;

  // Ateş sadece tıklamada; basılı tutmak otomatik ateş etmez.

  // ----- camera -----
  updateCamera();

  // ----- bullets (player) -----
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    // Bullets now live until they hit something or touch a world wall.
    if(b.life !== undefined){ b.life -= dt; if(b.life<=0){ bullets.splice(i,1); continue; } }
    if(b.x<=0 || b.y<=0 || b.x>=WORLD.w || b.y>=WORLD.h){ bullets.splice(i,1); continue; }
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(e.mutating) continue; // mutasyon animasyonu bitmeden boss hasar alamaz - önce tam olarak "gelsin"
      if(dist(b.x,b.y,e.x,e.y) < e.radius + 6){
        // Cube V2 (while its deflect phase is up) and a Knight with its
        // sword raised knock the bullet straight back at the player as a
        // parryable hazard orb, instead of taking damage from it.
        if(!autoPilot && !b.explosive && e.type==='cubev2' && e.parryActive){
          const backAng = Math.atan2(player.y-e.y, player.x-e.x);
          cubeBullets.push({
            x:e.x,y:e.y,
            vx:Math.cos(backAng)*900,vy:Math.sin(backAng)*900,
            dmg:Math.max(16,b.dmg*1.25),life:3.0,owner:'cube',parried:false,angle:backAng,type:b.type||'gun'
          });
          bullets.splice(i,1);
          spawnExplosion(b.x,b.y,0.45);
          break;
        }
        // Shotgun pellet damage depends on how far THIS pellet traveled.
        let hitDamage = b.dmg;
        if(b.type === 'shotgun'){
          const travel = Math.hypot(b.x-b.spawnX, b.y-b.spawnY);
          if(travel <= 85) hitDamage = 22 * 1.5 * DIFF.playerDmgMult;       // very close: 1.5x normal gun
          else if(travel <= 260) hitDamage = 22 * 0.5 * DIFF.playerDmgMult; // normal range: half normal gun
          else hitDamage = 22 * 0.25 * DIFF.playerDmgMult;                  // far range: quarter normal gun
        }
        if(b.explosive){
          // Patlayıcı parry mermisi hedefte patlar ve çevresine hasar verir.
          spawnExplosion(b.x,b.y,1.45);
          damageEnemiesInExplosion(b.x,b.y,b.explosionRadius||125,b.explosionDamage||120);
          bullets.splice(i,1);
          break;
        }
        if(autoPilot) hitDamage = e.maxHp * 5; // menüde her vuruş one-tap kill (boss dahil)
        hitDamage *= (b.dmgMultiplier || 1);
        e.hp -= hitDamage;
        e.hitFlash = 0.16;
        bullets.splice(i,1);
        if(e.hp <= 0){
          // Normal silah ölümü: Green ve Glob aynı 3x3 ceset parçalarına ayrılır.
          if(registerKill(e, false)){
            enemies.splice(j,1);
          }
        }
        break;
      }
    }
  }

  // ----- knight sword projectiles -----
  for(let i=swordProjectiles.length-1;i>=0;i--){
    const sp = swordProjectiles[i];
    sp.life -= dt;
    sp.x += sp.vx*dt;
    sp.y += sp.vy*dt;
    sp.angle = Math.atan2(sp.vy,sp.vx);

    if(sp.life <= 0 || sp.x<=0 || sp.y<=0 || sp.x>=WORLD.w || sp.y>=WORLD.h){
      swordProjectiles.splice(i,1);
      continue;
    }

    if(!sp.parried && sp.owner==='knight' &&
       player.invuln<=0 && dist(sp.x,sp.y,player.x,player.y) < player.radius+(sp.buffed ? 30 : 22)){
      damagePlayer(sp.dmg);
      spawnExplosion(sp.x,sp.y,0.55);
      swordProjectiles.splice(i,1);
      continue;
    }

    if(sp.parried && sp.owner==='player'){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(e.mutating) continue;
        if(dist(sp.x,sp.y,e.x,e.y) < e.radius+24){
          e.hp -= sp.dmg;
          e.hitFlash = 0.22;
          spawnExplosion(e.x,e.y,0.9);
          swordProjectiles.splice(i,1);
          if(e.hp<=0 && registerKill(e,true)) enemies.splice(j,1);
          break;
        }
      }
    }
  }

  // ----- Cube V2 gun bullets -----
  for(let i=cubeBullets.length-1;i>=0;i--){
    const cb=cubeBullets[i];
    cb.life-=dt;
    cb.x+=cb.vx*dt; cb.y+=cb.vy*dt;
    cb.angle=Math.atan2(cb.vy,cb.vx);
    if(cb.life<=0 || cb.x<=0 || cb.y<=0 || cb.x>=WORLD.w || cb.y>=WORLD.h){
      cubeBullets.splice(i,1); continue;
    }
    if(cb.owner==='cube' && player.invuln<=0 && dist(cb.x,cb.y,player.x,player.y)<player.radius+7){
      damagePlayer(cb.dmg);
      spawnExplosion(cb.x,cb.y,0.45);
      cubeBullets.splice(i,1); continue;
    }
    let parryTarget=null;
    if(cb.owner==='player'){ parryTarget=enemies.find(en=>en.type==='cubev2' && !en.mutating && dist(cb.x,cb.y,en.x,en.y)<en.radius+8) || null; }
    if(cb.owner==='player' && parryTarget){
      const e=parryTarget;
      // No single parry volley can remove more than 3% of V2's max HP.
      const now=performance.now();
      if(now > (e.parryDamageWindowUntil||0)){ e.parryDamageWindowUntil=now+140; e.parryDamageTaken=0; }
      const cap=Math.max(1,e.maxHp*0.03);
      const allowed=Math.max(0,cap-e.parryDamageTaken);
      const dealt=Math.min(cb.dmg,allowed);
      if(dealt>0){ e.hp-=dealt; e.parryDamageTaken+=dealt; e.hitFlash=0.18; spawnExplosion(cb.x,cb.y,0.55); }
      cubeBullets.splice(i,1);
      if(e.hp<=0 && registerKill(e,true)) enemies.splice(enemies.indexOf(e),1);
    }
  }

  // ----- yellow orbs (Glob projectile) -----
  for(let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];

    // Parrylenen orb hedefe kilitlenir ve hızını korur/yükseltir.
    if(o.parried && o.target && enemies.includes(o.target)){
      const tx = o.target.x - o.x;
      const ty = o.target.y - o.y;
      const td = Math.hypot(tx,ty) || 1;
      const desiredSpeed = 1320;
      const desiredVx = tx/td * desiredSpeed;
      const desiredVy = ty/td * desiredSpeed;
      const steer = Math.min(1, dt * 9);
      o.vx += (desiredVx-o.vx) * steer;
      o.vy += (desiredVy-o.vy) * steer;
    }

    o.x += o.vx*dt;
    o.y += o.vy*dt;

    if(o.x<=0 || o.y<=0 || o.x>=WORLD.w || o.y>=WORLD.h){
      if(o.parried) spawnExplosion(o.x,o.y,0.8);
      orbs.splice(i,1);
      continue;
    }

    if(!o.parried && player.invuln<=0 && dist(o.x,o.y,player.x,player.y) < player.radius+18){
      damagePlayer(o.dmg);
      orbs.splice(i,1);
      continue;
    }

    if(o.parried){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(e.mutating) continue; // mutasyon animasyonu bitmeden boss hasar alamaz
        if(dist(o.x,o.y,e.x,e.y) < e.radius+22){
          e.hp -= autoPilot ? e.maxHp * 5 : o.dmg;
          e.hitFlash = 0.22;
          spawnExplosion(e.x,e.y,1.0);
          orbs.splice(i,1);

          if(e.hp<=0){
            // Explosion/parry ölümü: aynı ceset parçaları ama çok daha güçlü fırlatılır.
            if(registerKill(e, true)){
              enemies.splice(j,1);
            }
          }
          break;
        }
      }
    }
  }

  // ----- enemy AI -----
  for(const e of enemies){
    if(e.hitFlash > 0) e.hitFlash -= dt;
    if(e.type === 'green') updateGreen(e, dt);
    else if(e.type === 'glob') updateGlob(e, dt);
    else if(e.type === 'knight') updateKnight(e, dt);
    else if(e.type === 'cubev2') updateCubeV2(e, dt);
  }

  // ----- stage progression -----
  // ME stage: the boss is gated at 200 kills.
  if(!autoPilot && currentStage===1 && !stage1Finished && player.totalKills >= 200 && nextBossThreshold===Infinity){
    stageMutationTriggered = true;
  }
  if(!autoPilot && currentStage===1 && stageMutationTriggered && !stage1Finished && !bossActive && bossEnemyRef===null){
    finishStage1();
  }
  // Stage 2 is a straight boss rush now: triggerCubeV2() is fired the
  // moment the player wakes up in the stage (see launchStage), so there
  // is no kill-count gate here anymore.
  // Stage completion (finishStage1) now handles its own transition -
  // showing the STAGE COMPLETE overlay and returning to the main menu -
  // so there is no automatic mid-run jump into the next stage anymore.

  // ----- spawn -----
  // Ana menüde arka planda gösteri yapıldığı için en baştan çok kalabalık
  // ve çok hızlı spawn olur. Gerçek oyunda ise kill sayısı arttıkça
  // kademeli olarak kalabalıklaşır: 100 kill'de daha fazla düşman,
  // 200 kill'de bunun 2 katı daha fazla, 300 kill'den sonra ise tıpkı
  // ana menüdeki kadar yoğun (aynı cap + aynı spawn hızı).
  spawnTimer -= dt;

  let spawnCap, spawnInterval;
  // After the Stage 1 global mutation fires, no more reinforcements spawn -
  // every enemy still alive at that moment has to be cleared to finish the stage.
  const stage1LastStand = (!autoPilot && currentStage===1 && bossActive);
  // Stage 2 never spawns regular waves - it's the boss (and only the boss).
  const stage2NoSpawns = (!autoPilot && currentStage===2);
  if(autoPilot){
    spawnCap = 100 + waveDifficulty;
    spawnInterval = Math.max(0.08, 0.35 - waveDifficulty*0.01);
  } else if(stage1LastStand || stage2NoSpawns){
    spawnCap = 0;
    spawnInterval = 999;
  } else {
    const kills = player.totalKills;
    if(kills >= 300){
      // Ana menüdekiyle birebir aynı yoğunluk.
      spawnCap = 100 + waveDifficulty;
      spawnInterval = Math.max(0.08, 0.35 - waveDifficulty*0.01);
    } else if(kills >= 200){
      spawnCap = 50 + waveDifficulty;      // 200'den sonra: ilk artışın 2 katı
      spawnInterval = Math.max(0.25, 1.2 - waveDifficulty*0.05);
    } else if(kills >= 100){
      spawnCap = 30 + waveDifficulty;      // 100'den sonra: daha fazla düşman
      spawnInterval = Math.max(0.4, 1.6 - waveDifficulty*0.06);
    } else {
      spawnCap = 10 + waveDifficulty;      // başlangıç yoğunluğu
      spawnInterval = Math.max(0.6, 2.2 - waveDifficulty*0.08);
    }
  }

  if(spawnTimer <= 0 && enemies.length < spawnCap){
    spawnEnemy();
    spawnTimer = spawnInterval;
    waveDifficulty += 0.05;
  }

  if(banner.timer>0) banner.timer -= dt;
}

function updateGreen(e, dt){
  // ----- boss awakening: grow in place, don't act until fully grown -----
  if(e.mutating){
    e.growTimer -= dt;
    const t = clamp(1 - Math.max(0,e.growTimer)/e.growDuration, 0, 1);
    // eased growth with a fading wobble/pulse on top, like it's shuddering awake
    const eased = 1 - Math.pow(1-t, 2);
    const wobble = Math.sin(t*Math.PI*7) * (1-t) * 0.12;
    e.radius = e.baseRadius + (e.targetRadius - e.baseRadius) * eased + e.baseRadius*wobble;
    if(e.growTimer <= 0){
      e.mutating = false;
      e.radius = e.targetRadius;
    }
    return; // stays put while it mutates
  }

  if(e.isBoss){
    if(e.orbBurstTimer === undefined) e.orbBurstTimer = e.orbBurstRate || 2.6;
    e.orbBurstTimer -= dt;
    if(e.orbBurstTimer <= 0){
      bossOrbBurst(e);
      e.orbBurstTimer = e.orbBurstRate || 2.6;
    }
  }

  const d = dist(e.x,e.y,player.x,player.y);
  if(e.hitCooldown>0) e.hitCooldown -= dt;

  if(e.state === 'chase'){
    if(d > 4){
      const ang = Math.atan2(player.y-e.y, player.x-e.x);
      e.x += Math.cos(ang)*e.speed*dt;
      e.y += Math.sin(ang)*e.speed*dt;
    }
    if(d < 95){
      e.state = 'telegraph';
      e.stateTimer = 0.42;
    }
    // contact damage (small chip damage while lingering close)
    if(d < e.radius + player.radius && player.invuln<=0 && e.hitCooldown<=0){
      damagePlayer(8);
      e.hitCooldown = 0.6;
    }
  } else if(e.state === 'telegraph'){
    e.stateTimer -= dt;
    if(e.stateTimer <= 0){
      e.state = 'lunge';
      e.stateTimer = 0.22;
      e.lungeFrom = {x:e.x,y:e.y};
      e.lungeTo = {x:player.x,y:player.y};
    }
  } else if(e.state === 'lunge'){
    e.stateTimer -= dt;
    const t = 1 - Math.max(0,e.stateTimer)/0.22;
    e.x = e.lungeFrom.x + (e.lungeTo.x - e.lungeFrom.x)*t;
    e.y = e.lungeFrom.y + (e.lungeTo.y - e.lungeFrom.y)*t;
    if(dist(e.x,e.y,player.x,player.y) < e.radius + player.radius && player.invuln<=0 && e.hitCooldown<=0){
      damagePlayer(e.dmg);
      e.hitCooldown = 1.0;
    }
    if(e.stateTimer <= 0){
      e.state = 'chase';
      e.stateTimer = 0;
    }
  }
}

// ---------- KNIGHT (stage 2 melee bruiser) ----------
// chase -> telegraph -> dash (attacks) -> retreat (hops back) -> chase.
// While chasing, it occasionally raises its sword (parryFlash) and any
// player bullet that touches it during that window gets knocked back at
// the player as a hazard orb instead of just damaging it.
function updateKnight(e, dt){
  if(e.hitCooldown>0) e.hitCooldown -= dt;
  if(e.swordCooldown>0) e.swordCooldown -= dt;
  if(e.swordSwing>0) e.swordSwing -= dt;

  const d = dist(e.x,e.y,player.x,player.y);

  if(e.state === 'chase'){
    if(d > 145){
      const ang = Math.atan2(player.y-e.y, player.x-e.x);
      e.x += Math.cos(ang)*e.speed*dt;
      e.y += Math.sin(ang)*e.speed*dt;
    }

    if(d < (e.buffed ? 205 : 175) && e.swordCooldown <= 0){
      e.state = 'sword_windup';
      e.stateTimer = e.buffed ? 0.36 : 0.42;
      e.swordAngle = Math.atan2(player.y-e.y, player.x-e.x);
      e.swordSwing = 0.48;
    }

    if(d < e.radius + player.radius && player.invuln<=0 && e.hitCooldown<=0){
      damagePlayer(10);
      e.hitCooldown = 0.7;
    }

  } else if(e.state === 'sword_windup'){
    e.stateTimer -= dt;
    const desired = Math.atan2(player.y-e.y, player.x-e.x);
    let diff = Math.atan2(Math.sin(desired-e.swordAngle), Math.cos(desired-e.swordAngle));
    e.swordAngle += diff * Math.min(1,dt*5);

    if(e.stateTimer <= 0){
      e.state = 'sword_throw';
      e.stateTimer = 0.18;
      const ang = e.swordAngle;
      const speed = e.buffed ? 1220 : 1080;
      swordProjectiles.push({
        x:e.x + Math.cos(ang)*(e.radius+24),
        y:e.y + Math.sin(ang)*(e.radius+24),
        vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        dmg:e.buffed ? 52 : 32, owner:'knight', parried:false, life:3.0, angle:ang, buffed:e.buffed
      });
      e.swordCooldown = 1.15;
      spawnExplosion(e.x + Math.cos(ang)*(e.radius+20),
                     e.y + Math.sin(ang)*(e.radius+20), 0.35);
    }

  } else if(e.state === 'sword_throw'){
    e.stateTimer -= dt;
    if(e.stateTimer <= 0){
      e.state = 'retreat';
      e.stateTimer = 0.34;
      const backAng = Math.atan2(e.y-player.y, e.x-player.x);
      e.retreatDir = {x:Math.cos(backAng), y:Math.sin(backAng)};
    }

  } else if(e.state === 'retreat'){
    e.stateTimer -= dt;
    e.x += e.retreatDir.x * e.speed * 1.8 * dt;
    e.y += e.retreatDir.y * e.speed * 1.8 * dt;
    if(e.stateTimer <= 0){
      e.state = 'chase';
      e.stateTimer = 0;
    }
  }

  e.x = clamp(e.x, e.radius, WORLD.w-e.radius);
  e.y = clamp(e.y, e.radius, WORLD.h-e.radius);
}

// ---------- CUBE V2 (stage 2 boss) ----------
// Grows in immediately when stage 2 starts (see launchStage). Every
// attack is a parryable orb burst; while its "deflect" phase is active,
// our raw bullets bounce off it back at us instead of dealing damage
// (parried shots still hurt it fine) - so parry is the real way to beat it.
function triggerCubeV2(){
  if(stage2BossTriggered) return;
  stage2BossTriggered = true;
  banner.text = ''; banner.timer = 0;

  for(const en of enemies) spawnExplosion(en.x, en.y, 1.2);
  enemies = [];
  orbs = [];
  swordProjectiles = [];
  cubeBullets = [];

  screenShake = { timer:1.0, duration:1.0, strength:16 };

  // Cube V2 is the same scale as the player, not a giant boss.
  const cx = player.x;
  const cy = player.y - 190;
  const baseR = player.radius;
  const ghp = 10000 * DIFF.bossHpMult;
  const e = {
    type:'cubev2', x:cx, y:cy, radius:baseR, hp:ghp, maxHp:ghp,
    isBoss:true, bossName:'CUBE V2',
    baseRadius:baseR, targetRadius:baseR, mutating:false, growTimer:0, growDuration:0,
    speed:255, dmg:28,
    weapon:'gun', weaponTimer:3.5,
    gunFireTimer:0.75, gunFireRate:0.62, shotgunFireTimer:1.2, shotgunFireRate:1.35,
    dashTimer:2.0, dashCooldown:2.0, dashing:false, dashTimerActive:0,
    dashFrom:{x:cx,y:cy}, dashTo:{x:cx,y:cy},
    parryTimer:1.7, parryActive:false, parryDuration:0.55,
    hitFlash:0, parryFlash:0, aimAngle:Math.PI/2,
    parryDamageWindowUntil:0, parryDamageTaken:0, tauntTimer:4.5
  };
  enemies.push(e);
  cubeV2Ref = e;
  cubeV2Clones = [];
  // Two fake Cube V2 clones attack together with the real boss.
  for(let i=0;i<2;i++){
    const side=i===0?-1:1;
    const c={...e, isClone:true, bossName:'FAKE CUBE', hp:ghp*0.34, maxHp:ghp*0.34, dmg:18, speed:225,
      x:clamp(cx+side*220,baseR,WORLD.w-baseR), y:clamp(cy+110,baseR,WORLD.h-baseR),
      weaponTimer:1.4+i*.7, gunFireTimer:.55+i*.2, dashTimer:1.3+i*.45, parryTimer:1.1+i*.4, tauntTimer:9999};
    enemies.push(c); cubeV2Clones.push(c);
  }
  cubeV2BossBars = [e, ...cubeV2Clones];
  bossEnemyRef = e;
  bossActive = true;

  // Brief awakening pulse, then the dialogue. Combat stays frozen until the dialogue ends.
  bossPulse.active = true;
  bossPulse.timer = 0.9;
  bossPulse.duration = 0.9;
  bossPulse.x = e.x; bossPulse.y = e.y;

  setTimeout(() => {
    if(cubeV2Ref===e && player.alive && currentStage===2) startCubeDialogue();
  }, 450);
}

function cubeV2OrbBurst(e){
  const baseAng = Math.atan2(player.y - e.y, player.x - e.x);
  const count = 7;
  const totalSpread = 1.15;
  const dmg = e.dmg;
  for(let i=0;i<count;i++){
    const t = (i/(count-1)) - 0.5;
    const ang = baseAng + t*totalSpread;
    orbs.push({ x: e.x, y: e.y, vx: Math.cos(ang)*760, vy: Math.sin(ang)*760, dmg });
  }
  screenShake.timer = Math.max(screenShake.timer, 0.2);
  screenShake.duration = Math.max(screenShake.duration, 0.2);
  screenShake.strength = Math.max(screenShake.strength, 7);
}

function cubeV2Shoot(e){
  const aim = Math.atan2(player.y-e.y, player.x-e.x);
  e.aimAngle = aim;
  const muzzleDist = e.radius + 18;
  if(e.weapon==='shotgun'){
    // V2 uses the same shotgun concept as the player: a real spread of pellets.
    const spreads=[-0.28,-0.18,-0.09,0,0.09,0.18,0.28];
    for(const spread of spreads){
      const a=aim+spread;
      cubeBullets.push({x:e.x+Math.cos(a)*muzzleDist,y:e.y+Math.sin(a)*muzzleDist,
        vx:Math.cos(a)*760,vy:Math.sin(a)*760,dmg:e.dmg*0.72,life:2.8,owner:'cube',parried:false,angle:a,type:'shotgun'});
    }
  } else {
    const speed=860;
    cubeBullets.push({x:e.x+Math.cos(aim)*muzzleDist,y:e.y+Math.sin(aim)*muzzleDist,
      vx:Math.cos(aim)*speed,vy:Math.sin(aim)*speed,dmg:e.dmg,life:3.0,owner:'cube',parried:false,angle:aim,type:'gun'});
  }
}

function updateCubeV2(e, dt){
  if(cubeDialogueActive) return;
  if(e.parryFlash > 0) e.parryFlash -= dt;
  e.weaponTimer -= dt;
  if(e.weaponTimer <= 0){ e.weapon = e.weapon==='gun' ? 'shotgun' : 'gun'; e.weaponTimer = e.weapon==='shotgun' ? 4.2 : 3.2; }

  const d = dist(e.x,e.y,player.x,player.y);
  const desiredAim = Math.atan2(player.y-e.y, player.x-e.x);
  let angleDiff = Math.atan2(Math.sin(desiredAim-e.aimAngle), Math.cos(desiredAim-e.aimAngle));
  e.aimAngle += angleDiff * Math.min(1,dt*7);

  // Short aggressive dash directly at the player.
  if(e.dashing){
    e.dashTimerActive -= dt;
    const t=1-Math.max(0,e.dashTimerActive)/0.24;
    e.x=e.dashFrom.x+(e.dashTo.x-e.dashFrom.x)*t;
    e.y=e.dashFrom.y+(e.dashTo.y-e.dashFrom.y)*t;
    if(dist(e.x,e.y,player.x,player.y)<e.radius+player.radius && player.invuln<=0){
      damagePlayer(e.dmg+8);
      // Launch the player toward the nearest arena edge instead of teleporting:
      // it visibly flies across the map for a short, violent knockback.
      const dxEdge = Math.min(player.x-player.radius, WORLD.w-player.radius-player.x);
      const dyEdge = Math.min(player.y-player.radius, WORLD.h-player.radius-player.y);
      let tx,ty;
      if(dxEdge < dyEdge){ tx = player.x < WORLD.w/2 ? player.radius : WORLD.w-player.radius; ty=player.y; }
      else { tx=player.x; ty = player.y < WORLD.h/2 ? player.radius : WORLD.h-player.radius; }
      const ktime=0.38;
      player.knockbackX=(tx-player.x)/ktime;
      player.knockbackY=(ty-player.y)/ktime;
      player.knockbackTime=ktime;
      screenShake.timer=Math.max(screenShake.timer,0.32);
      screenShake.duration=Math.max(screenShake.duration,0.32);
      screenShake.strength=Math.max(screenShake.strength,12);
    }
    if(e.dashTimerActive<=0){
      e.dashing=false;
      e.dashTimer=1.8+Math.random()*1.2;
    }
  } else {
    e.dashTimer-=dt;
    if(e.dashTimer<=0 && d<520){
      e.dashing=true;
      e.dashTimerActive=0.24;
      e.dashFrom={x:e.x,y:e.y};
      e.dashTo={x:player.x,y:player.y};
      screenShake.timer=Math.max(screenShake.timer,0.16);
      screenShake.duration=Math.max(screenShake.duration,0.16);
      screenShake.strength=Math.max(screenShake.strength,5);
    } else {
      // Circle the player at roughly mid range, like the menu player AI.
      const targetDist=260;
      const radial=d-targetDist;
      const toward=Math.max(-1,Math.min(1,radial/180));
      const strafe=Math.sin(performance.now()/420)>0?1:-1;
      const ang=Math.atan2(player.y-e.y,player.x-e.x);
      const mx=Math.cos(ang)*toward + Math.cos(ang+Math.PI/2)*strafe*0.72;
      const my=Math.sin(ang)*toward + Math.sin(ang+Math.PI/2)*strafe*0.72;
      const ml=Math.hypot(mx,my)||1;
      e.x+=mx/ml*e.speed*dt; e.y+=my/ml*e.speed*dt;
    }
  }

  // The Cube occasionally raises its gun and parries player bullets.
  e.parryTimer-=dt;
  if(e.parryTimer<=0){
    e.parryActive=true;
    e.parryTimer=e.parryDuration + 1.4 + Math.random()*1.8;
    e.parryEndTimer=e.parryDuration;
  }
  if(e.parryActive){
    e.parryEndTimer-=dt;
    if(e.parryEndTimer<=0) e.parryActive=false;
  }

  // Gun/shotgun fire is independent from dash/parry.
  e.gunFireTimer-=dt;
  if(e.gunFireTimer<=0){
    cubeV2Shoot(e);
    e.gunFireTimer=(e.weapon==='shotgun'?e.shotgunFireRate:e.gunFireRate)*(0.8+Math.random()*0.35);
  }

  if(dist(e.x,e.y,player.x,player.y)<e.radius+player.radius && player.invuln<=0){
    damagePlayer(10);
  }

  e.x=clamp(e.x,e.radius,WORLD.w-e.radius);
  e.y=clamp(e.y,e.radius,WORLD.h-e.radius);
}

function mutateGlobStage1(e){
  if(e.isStageMutation) return;
  e.isStageMutation = true;
  e.bossName = 'MUTATED GLOB';
  e.maxHp *= 2.2; e.hp = Math.max(e.hp, e.maxHp);
  e.radius *= 1.45; e.speed *= 1.18;
  e.fireTimer = 0.25;
  e.mutationBurstTimer = 0.9 + Math.random()*0.8;
}
function triggerStage1Mutation(){
  if(stageMutationTriggered) return;
  stageMutationTriggered = true;
  banner.text='GLOBAL MUTATION'; banner.timer=2.4;
  for(const e of enemies){
    if(e.type==='glob') mutateGlobStage1(e);
    else if(e.type==='green'){ e.speed*=1.12; e.dmg=Math.round(e.dmg*1.25); e.hitFlash=0.8; }
  }
  screenShake={timer:1.0,duration:1.0,strength:13};
  for(let n=0;n<24;n++) spawnExplosion(player.x+(Math.random()-.5)*canvas.width*0.8, player.y+(Math.random()-.5)*canvas.height*0.8, .8+Math.random()*1.3);
}
function finishStage1(){
  if(stage1Finished) return;
  stage1Finished=true;
  banner.text='STAGE 1 COMPLETE'; banner.timer=2.8;
  for(let n=0;n<45;n++) spawnExplosion(player.x+(Math.random()-.5)*canvas.width, player.y+(Math.random()-.5)*canvas.height, 1+Math.random()*1.8);
  screenShake={timer:1.4,duration:1.4,strength:22};
  localStorage.setItem('kt_stage1_complete','1');
  showStageCompleteScreen(1);
}

// Shows the full-screen "STAGE COMPLETE" overlay for a beat, then sends
// the player back to the main menu (bot takes back over, elevator music).
function showStageCompleteScreen(n){
  const el = document.getElementById('stageCompleteScreen');
  document.getElementById('stageCompleteTitle').textContent =
    (n===1 ? 'ME' : 'CUBE V2') + ' COMPLETE';
  document.getElementById('stageCompleteStats').textContent =
    `Total kills: ${player.totalKills}  •  Best streak: ${player.killStreak}`;
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    backToMainMenu();
  }, 2600);
}
function updateGlob(e, dt){
  const d = dist(e.x,e.y,player.x,player.y);
  const ang = Math.atan2(player.y-e.y, player.x-e.x);
  if(d < e.preferredMin){
    e.x -= Math.cos(ang)*e.speed*dt;
    e.y -= Math.sin(ang)*e.speed*dt;
  } else if(d > e.preferredMax){
    e.x += Math.cos(ang)*e.speed*dt;
    e.y += Math.sin(ang)*e.speed*dt;
  } else {
    // hafif yanal (strafe) hareket
    e.x += Math.cos(ang+Math.PI/2)*e.speed*0.35*dt;
    e.y += Math.sin(ang+Math.PI/2)*e.speed*0.35*dt;
  }
  e.x = clamp(e.x, e.radius, WORLD.w-e.radius);
  e.y = clamp(e.y, e.radius, WORLD.h-e.radius);

  e.fireTimer -= dt;
  if(e.fireTimer <= 0){
    const a2 = Math.atan2(player.y-e.y, player.x-e.x);
    if(e.isStageMutation){
      // Mutated Glob: a 10-orb burst with recoil.
      const count=10;
      for(let i=0;i<count;i++){
        const a=a2 + ((i/(count-1))-0.5)*1.25;
        orbs.push({x:e.x,y:e.y,vx:Math.cos(a)*1040,vy:Math.sin(a)*1040,dmg:18});
      }
      e.x -= Math.cos(a2)*34; e.y -= Math.sin(a2)*34;
      spawnExplosion(e.x,e.y,0.72);
      e.fireTimer = 2.0 + Math.random()*0.7;
    } else {
      e.fireTimer = 2.2 + Math.random()*0.9;
      orbs.push({x:e.x,y:e.y,vx: Math.cos(a2)*980,vy: Math.sin(a2)*980,dmg:14});
    }
  }
}

function spawnExplosion(x,y,scale=1){
  explosions.push({x,y,timer:0.34,maxTimer:0.34,scale});
  if(!autoPilot) playSFX(SFX.explosion, 0.55);
}

function spawnDeathPieces(){
  const bodyImg = playerPortrait();
  const size = player.radius*2 + 20;
  deathPieces = [];

  for(let py=0;py<2;py++){
    for(let px=0;px<2;px++){
      const a = Math.random()*Math.PI*2;
      const speed = 170 + Math.random()*260;
      deathPieces.push({
        x:player.x+(px?7:-7),
        y:player.y+(py?7:-7),
        vx:Math.cos(a)*speed,
        vy:Math.sin(a)*speed-90,
        rot:Math.random()*Math.PI*2,
        vr:(Math.random()-0.5)*12,
        size:size*0.58,
        alpha:1,
        sx:px*0.5,
        sy:py*0.5,
        img:bodyImg,
        life:1.05
      });
    }
  }
  spawnExplosion(player.x,player.y,1.35);
}


function damageEnemiesInExplosion(x,y,radius,damage){
  for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(e.mutating) continue; // mutasyon animasyonu bitmeden boss hasar alamaz
    const d=dist(x,y,e.x,e.y);
    if(d>radius+e.radius) continue;
    const scale=Math.max(0.35,1-d/(radius+e.radius));
    e.hp -= damage*scale;
    e.hitFlash=0.28;
    if(e.hp<=0){
      if(registerKill(e, true)){
        enemies.splice(j,1);
      }
    }
  }
}

function spawnCorpsePieces(e, exploded=false){
  const img = e.type === 'glob' ? IMG.glob
    : e.type === 'knight' ? IMG.knight
    : e.type === 'cubev2' ? IMG.hard
    : IMG.green;
  const fullSize = e.radius*2 + 14;
  const cols = 3, rows = 3;
  const pieceW = fullSize / cols;
  const pieceH = fullSize / rows;

  for(let py=0; py<rows; py++){
    for(let px=0; px<cols; px++){
      const a = Math.random()*Math.PI*2;
      // Normal ölüm kontrollü; explosion/parry çok daha sert ve uzağa fırlatır.
      const speed = exploded
        ? 620 + Math.random()*980
        : 95 + Math.random()*170;

      corpsePieces.push({
        x:e.x + (px-1)*pieceW*0.20,
        y:e.y + (py-1)*pieceH*0.20,
        vx:Math.cos(a)*speed,
        vy:Math.sin(a)*speed,
        rot:(Math.random()-0.5)*0.8,
        vr:(Math.random()-0.5)*(exploded ? 26 : 9),
        fullSize,
        pieceW,
        pieceH,
        px, py,
        cols, rows,
        img,
        alpha:1,
        life:10,
        settled:false,
        exploded
      });
    }
  }
}

function damagePlayer(amount){
  if(player.invuln > 0 || !player.alive) return;
  if(autoPilot){
    // Ana menüdeki bot ölümsüz - hiç hasar almaz, streak hiç kırılmaz.
    player.invuln = 0.15;
    return;
  }
  player.hp -= amount;
  player.killStreak = 0; // getting hit resets the streak -> body reverts to nice.png
  player.invuln = 0.5;
  if(player.hp <= 0){
    player.hp = 0;
    player.alive = false;
    cubeDialogueActive=false;
    document.getElementById('cubeDialogue').classList.remove('show','silence');
    currentGameMusic().pause();
    stopDivine();
    spawnDeathPieces();
    showDeathScreen();
  }
}

// Heals the player (used for point-blank "execution" kills) and kicks off
// a green pulse ring around them so the heal is readable at a glance.
function healPlayer(amount){
  if(!player.alive) return;
  player.hp = Math.min(player.maxHp, player.hp + amount);
  healPulseTimer = 0.4;
  if(!autoPilot) playSFX(SFX.heal, 0.6);
}

function showBanner(){
  const msgs = ['STREAK!','NICE!','KEEP GOING!','ON FIRE!','UNSTOPPABLE!'];
  if(player.killStreak >= 7) banner.text = 'BRUTAL!';
  else if(player.killStreak >= 3) banner.text = msgs[Math.min(msgs.length-1, player.killStreak-1)];
  else banner.text = 'KILL';
  banner.timer = 0.6;
}

// ---------- RENDER ----------
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // --- screen shake (boss awakening / orb bursts) ---
  let shakeX = 0, shakeY = 0;
  if(screenShake.timer > 0){
    const p = screenShake.timer / screenShake.duration; // 1 -> 0
    const mag = screenShake.strength * p;
    shakeX = (Math.random()*2-1) * mag;
    shakeY = (Math.random()*2-1) * mag;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // --- map (offset by camera) - Stage 1 -> Map.png, Stage 2 -> map2.png ---
  const mapImg = currentMapImg();
  if(mapImg.loaded){
    // stretched to exactly cover the world bounds, offset by camera
    // Integer camera coordinates + smoothing off keeps map art crisp while stretched.
    const mapX = -Math.round(camera.x);
    const mapY = -Math.round(camera.y);
    ctx.drawImage(mapImg, mapX, mapY, Math.round(WORLD.w), Math.round(WORLD.h));
  } else {
    ctx.fillStyle = '#25321f';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    const grid = 100;
    for(let gx = -((camera.x)%grid); gx<canvas.width; gx+=grid){
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,canvas.height); ctx.stroke();
    }
    for(let gy = -((camera.y)%grid); gy<canvas.height; gy+=grid){
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.font='bold 13px Arial';
    const missingName = currentStage===2 ? 'images/map2.png' : 'images/Map.png';
    ctx.fillText(missingName+' not found - showing placeholder ground', 16, canvas.height-16);
  }

  // --- corpses are always on the back layer ---
  for(const piece of corpsePieces) drawCorpsePiece(piece);

  // --- sort world objects by y for simple depth ordering ---
  const drawables = [];
  for(const e of enemies) drawables.push({y:e.y, draw:()=>drawEnemy(e)});
  drawables.push({y:player.y, draw:()=>drawPlayer()});
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.draw();

  // --- explosion.png effects ---
  for(const ex of explosions){
    const p = 1 - ex.timer/ex.maxTimer;
    const sx = ex.x-camera.x, sy = ex.y-camera.y;

    if(IMG.explosion.loaded){
      ctx.save();
      ctx.globalAlpha = Math.max(0,1-p);
      const s = (55+p*115)*ex.scale;
      ctx.drawImage(IMG.explosion,sx-s/2,sy-s/2,s,s);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = Math.max(0,1-p);
      ctx.strokeStyle = '#ffcc33';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(sx,sy,(20+p*65)*ex.scale,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // --- Düşman ceset parçaları arka katmanda drawCorpsePiece ile çizilir ---

  // --- PNG parçaları: ölümde dışarı saçılır ve düşer ---
  for(const piece of deathPieces){
    const sx = piece.x-camera.x, sy = piece.y-camera.y;
    ctx.save();
    ctx.globalAlpha = piece.alpha;
    ctx.translate(sx,sy);
    ctx.rotate(piece.rot);

    if(piece.img && piece.img.loaded){
      ctx.beginPath();
      ctx.rect(-piece.size/2,-piece.size/2,piece.size/2,piece.size/2);
      ctx.clip();
      ctx.drawImage(
        piece.img,
        -piece.size/2-piece.sx*piece.size,
        -piece.size/2-piece.sy*piece.size,
        piece.size*2,
        piece.size*2
      );
    } else {
      ctx.fillStyle = '#cc3333';
      ctx.fillRect(-piece.size/4,-piece.size/4,piece.size/2,piece.size/2);
    }
    ctx.restore();
  }

  // Cube V2 gun bullets (same visual bullet as the player gun).
  for(const cb of cubeBullets){
    const sx=cb.x-camera.x, sy=cb.y-camera.y;
    ctx.save();
    ctx.shadowColor=cb.parried?'#fff06a':'#ff5555';
    ctx.shadowBlur=cb.parried?22:14;
    drawRotatedImage(IMG.bullet,sx,sy,cb.parried?30:26,cb.parried?14:12,Math.atan2(cb.vy,cb.vx),'#ff5555','');
    ctx.restore();
  }

  // bullets / orbs (drawn on top)
  for(const b of bullets){
    const sx = b.x - camera.x, sy = b.y - camera.y;
    const ang = Math.atan2(b.vy,b.vx);
    if(b.explosive){ ctx.save(); ctx.shadowColor='#ff9a22'; ctx.shadowBlur=18; drawRotatedImage(IMG.bullet, sx, sy, 32, 16, ang, '#ffcc00', ''); ctx.restore(); } else { drawRotatedImage(IMG.bullet, sx, sy, 26, 12, ang, '#ffcc00', ''); }
  }
  for(const o of orbs){
    const sx = o.x - camera.x, sy = o.y - camera.y;
    const ang = Math.atan2(o.vy, o.vx);
    if(IMG.orb.loaded){
      ctx.save();
      ctx.shadowColor = '#ffee66';
      ctx.shadowBlur = 16;
      ctx.translate(sx, sy);
      ctx.rotate(ang);
      ctx.drawImage(IMG.orb, -(o.parried?32:22), -(o.parried?32:22), o.parried?64:44, o.parried?64:44);
      ctx.restore();
    } else {
      // fallback glow circle if images/yellow-orb.png wasn't found
      ctx.save();
      ctx.beginPath();
      ctx.fillStyle = '#ffdd22';
      ctx.shadowColor = '#ffee66';
      ctx.shadowBlur = 18;
      ctx.arc(sx, sy, 16, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Parry pulse artık HUD ekranının ortasında değil, parrylenen orbun
  // bulunduğu dünya pozisyonundan çıkar.
  if(parryPulseTimer > 0 && parryPulse.active){
    const p = 1 - parryPulseTimer / 0.38;
    const px = parryPulse.x - camera.x;
    const py = parryPulse.y - camera.y;
    const r = 18 + p * 105;
    ctx.save();
    ctx.globalAlpha = (1-p) * 0.9;
    ctx.strokeStyle = '#fff06a';
    ctx.lineWidth = 7 - p*4;
    ctx.shadowColor = '#ffd52e';
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = (1-p) * 0.28;
    ctx.fillStyle = '#fff7a0';
    ctx.beginPath();
    ctx.arc(px, py, r*0.62, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else {
    parryPulse.active = false;
  }

  // --- boss "awakening" pulse (big red ring where the mutation is happening) ---
  if(bossPulse.active && bossPulse.timer > 0){
    const p = 1 - bossPulse.timer / bossPulse.duration;
    const bx = bossPulse.x - camera.x;
    const by = bossPulse.y - camera.y;
    const ringCount = 3;
    for(let i=0;i<ringCount;i++){
      const ringP = clamp(p*1.3 - i*0.18, 0, 1);
      if(ringP<=0 || ringP>=1) continue;
      const r = 20 + ringP * 260;
      ctx.save();
      ctx.globalAlpha = (1-ringP) * 0.55;
      ctx.strokeStyle = '#ff2222';
      ctx.lineWidth = 9 - ringP*5;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 28;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.12*Math.sin(performance.now()/60);
    ctx.fillStyle = '#ff3333';
    ctx.beginPath();
    ctx.arc(bx, by, 34, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // --- heal pulse (green ring on the player from a point-blank kill) ---
  if(healPulseTimer > 0){
    const p = 1 - healPulseTimer / 0.4;
    const psx = player.x - camera.x, psy = player.y - camera.y;
    const r = 14 + p * 70;
    ctx.save();
    ctx.globalAlpha = (1-p) * 0.9;
    ctx.strokeStyle = '#39ff6e';
    ctx.lineWidth = 6 - p*3;
    ctx.shadowColor = '#26ff5e';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(psx, psy, r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = (1-p) * 0.25;
    ctx.fillStyle = '#8dffaa';
    ctx.beginPath();
    ctx.arc(psx, psy, r*0.55, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // end screen-shake transform

  updateUI();
}


function drawCorpsePiece(piece){
  const sx = piece.x-camera.x, sy = piece.y-camera.y;
  if(sx<-100 || sy<-100 || sx>canvas.width+100 || sy>canvas.height+100) return;

  ctx.save();
  ctx.globalAlpha = piece.alpha;
  ctx.translate(sx,sy);
  ctx.rotate(piece.rot);

  if(piece.img && piece.img.loaded){
    const srcW = piece.img.naturalWidth / piece.cols;
    const srcH = piece.img.naturalHeight / piece.rows;
    ctx.drawImage(
      piece.img,
      piece.px*srcW, piece.py*srcH, srcW, srcH,
      -piece.pieceW/2, -piece.pieceH/2, piece.pieceW, piece.pieceH
    );
  } else {
    ctx.fillStyle = piece.img===IMG.glob ? '#d7b91c' : '#35c84b';
    ctx.fillRect(-piece.pieceW/2,-piece.pieceH/2,piece.pieceW,piece.pieceH);
  }
  ctx.restore();
}

function drawPlayer(){
  const sx = player.x - camera.x, sy = player.y - camera.y;
  const mw = mouseWorld();
  const aimAngle = Math.atan2(mw.y - player.y, mw.x - player.x);
  const facingLeft = Math.cos(aimAngle) < 0;

  ctx.save();
  if(player.invuln > 0 && Math.floor(player.invuln*30)%2===0){
    ctx.globalAlpha = 0.45;
  }

  // Body IS the mood sprite (nice.png / mid.png / angry.png), no separate
  // portrait UI - it swaps directly based on kill streak, and flips to
  // face the aim direction.
  const bodyImg = playerPortrait();
  const size = player.radius*2 + 20;
  ctx.translate(sx, sy);
  if(facingLeft) ctx.scale(-1, 1);
  if(bodyImg.loaded){
    ctx.drawImage(bodyImg, -size/2, -size/2, size, size);
  } else {
    const label = player.killStreak>=7 ? 'ANGRY' : player.killStreak>=3 ? 'MID' : 'NICE';
    const color = player.killStreak>=7 ? '#cc2222' : player.killStreak>=3 ? '#cc8822' : '#33aa55';
    drawPlaceholder(0, 0, size, size, color, label, 0);
  }
  ctx.restore();

  // gun.png points WEST (left) at 0 radians. Rotate it directly with aim.
  // The muzzle position and bullet direction use the SAME aimAngle.
  const gunDist = player.radius + 10;
  const gx = sx + Math.cos(aimAngle) * gunDist;
  const gy = sy + Math.sin(aimAngle) * gunDist;
  const gunAngle = aimAngle + GUN_ART_OFFSET;
  const weaponImg = weapon==='shotgun' ? IMG.shotgun : IMG.gun;
  drawRotatedImage(weaponImg, gx, gy, weapon==='shotgun'?58:46, weapon==='shotgun'?58:46, gunAngle, '#888888', weapon==='shotgun'?'SHOTGUN':'GUN');
}

function drawKnightEnemy(e, sx, sy){
  const size = e.radius*2 + 14;
  let faceAng = Math.atan2(player.y-e.y, player.x-e.x);
  if(e.state==='sword_windup' || e.state==='sword_throw') faceAng=e.swordAngle||faceAng;
  const facingRight = Math.cos(faceAng)>=0;

  ctx.save();
  ctx.translate(sx,sy);
  if(facingRight) ctx.scale(-1,1);

  if(e.buffed){
    ctx.shadowColor='#ffb300';
    ctx.shadowBlur=26;
  }
  if(e.state==='sword_windup'){
    const flash = 0.5+0.5*Math.sin(performance.now()/45);
    ctx.shadowColor='#ff3333'; ctx.shadowBlur=22*flash;
  }
  if(IMG.knight.loaded) ctx.drawImage(IMG.knight,-size/2,-size/2,size,size);
  else drawPlaceholder(0,0,size,size,'#8899aa','KNIGHT',0);

  // Weapon is visibly held and swung, then disappears from the hand on throw.
  if(e.state!=='sword_throw'){
    const swordSize=size*(e.swordScale || 1.35);
    let handAngle=0.05;
    if(e.state==='sword_windup'){
      const p=clamp(1-e.stateTimer/(e.buffed ? 0.36 : 0.42),0,1);
      handAngle=-1.25+p*0.25;
    } else {
      handAngle=Math.sin(performance.now()/220)*0.08;
    }
    if(IMG.sword.loaded){
      ctx.save();
      ctx.translate(size*0.16,0);
      ctx.rotate(handAngle);
      ctx.drawImage(IMG.sword,-swordSize*0.08,-swordSize*0.5,swordSize,swordSize);
      ctx.restore();
    }
  }
  ctx.restore();

  if(e.buffed){
    ctx.save();
    ctx.globalAlpha=0.75;
    ctx.strokeStyle='#ffb300';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx,sy,size*0.62,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  if(e.hitFlash>0){
    ctx.save();
    ctx.globalAlpha=Math.min(0.6,e.hitFlash/0.16);
    ctx.fillStyle='#ff2222';
    ctx.beginPath();ctx.arc(sx,sy,size/2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawCubeV2(e, sx, sy){
  // V2 is a normal player-sized character, using angry.png and the same
  // weapon art/aiming style as the main-menu player.
  const size = player.radius*2 + 20;
  const aim = e.aimAngle || Math.atan2(player.y-e.y, player.x-e.x);
  const facingLeft = Math.cos(aim) < 0;
  const bodyImg = IMG.angry;

  ctx.save();
  ctx.translate(sx,sy);
  if(facingLeft) ctx.scale(-1,1);
  ctx.shadowColor = e.parryActive ? '#ffffff' : '#ff3030';
  ctx.shadowBlur = e.parryActive ? 28 : 18;
  if(bodyImg.loaded) ctx.drawImage(bodyImg,-size/2,-size/2,size,size);
  else drawPlaceholder(0,0,size,size,'#d22','CUBE V2',0);
  ctx.restore();

  const gunDist = player.radius + 10;
  const gx = sx + Math.cos(aim)*gunDist;
  const gy = sy + Math.sin(aim)*gunDist;
  const weaponImg = e.weapon==='shotgun' ? IMG.shotgun : IMG.gun;
  drawRotatedImage(weaponImg,gx,gy,e.weapon==='shotgun'?58:46,e.weapon==='shotgun'?58:46,aim+GUN_ART_OFFSET,'#888',e.weapon==='shotgun'?'SHOTGUN':'GUN');

  if(e.parryFlash > 0 || e.parryActive){
    ctx.save();
    ctx.globalAlpha = e.parryActive ? 0.9 : Math.min(1,e.parryFlash/0.24);
    ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.shadowColor='#fff'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(sx,sy,e.radius+14,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  if(e.hitFlash > 0){
    ctx.save(); ctx.globalAlpha=Math.min(.55,e.hitFlash/.16); ctx.fillStyle='#ff2222';
    ctx.beginPath(); ctx.arc(sx,sy,size/2,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function drawEnemy(e){
  const sx = e.x - camera.x, sy = e.y - camera.y;
  if(sx < -80 || sy < -80 || sx > canvas.width+80 || sy > canvas.height+80) return;

  if(e.type === 'knight'){ drawKnightEnemy(e, sx, sy); return; }
  if(e.type === 'cubev2'){ drawCubeV2(e, sx, sy); return; }

  const img = e.type === 'green' ? IMG.green : IMG.glob;
  const size = e.radius*2 + 14;
  let flash = 0;
  if(e.type==='green' && e.state==='telegraph'){
    flash = 0.5 + 0.5*Math.sin(performance.now()/40);
  }

  ctx.save();
  if(flash>0){
    ctx.shadowColor = '#ff2222';
    ctx.shadowBlur = 18*flash;
  }
  if(img.loaded){
    ctx.drawImage(img, sx-size/2, sy-size/2, size, size);
  } else {
    drawPlaceholder(sx, sy, size, size, e.type==='green' ? '#2ecc40':'#e6c419', e.type.toUpperCase(), 0);
  }
  // Health bar yerine hasar alınca kısa kırmızı flash.
  if(e.hitFlash > 0){
    ctx.globalCompositeOperation='source-atop';
    ctx.globalAlpha=Math.min(0.78,e.hitFlash/0.16);
    ctx.fillStyle='#ff2222';
    ctx.fillRect(sx-size/2,sy-size/2,size,size);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  ctx.restore();

}

function updateUI(){
  document.getElementById('hpBar').style.width = (100*player.hp/player.maxHp)+'%';
  document.getElementById('hpText').textContent = Math.max(0,Math.round(player.hp))+' / '+player.maxHp;
  const dashPct = player.dashCooldown<=0 ? 100 : 100*(1 - player.dashCooldown/player.dashCooldownMax);
  document.getElementById('dashBar').style.width = dashPct+'%';
  document.getElementById('streakText').textContent = `Stage: ${currentStage}  •  Streak: ${player.killStreak}  •  Kills: ${player.totalKills}`;

  const bossWrapEl = document.getElementById('bossBarWrap');
  const multiBossEl = document.getElementById('multiBossBars');
  if(currentStage===2 && cubeV2BossBars.length && (bossActive || cubeV2BossBars.some(e=>e.hp>0))){
    bossWrapEl.classList.remove('show');
    multiBossEl.classList.add('show');
    const trio=cubeV2BossBars;
    for(let i=0;i<3;i++){
      const e=trio[i];
      document.getElementById('cubeBossName'+i).textContent=i===0?'CUBE V2':'FAKE CUBE';
      document.getElementById('cubeBossBar'+i).style.width=e?Math.max(0,100*e.hp/e.maxHp)+'%':'0%';
    }
  } else if(bossActive && bossEnemyRef){
    multiBossEl.classList.remove('show');
    bossWrapEl.classList.add('show');
    document.getElementById('bossName').textContent = bossEnemyRef.bossName || 'MUTATED GREEN';
    document.getElementById('bossBar').style.width = Math.max(0, 100*bossEnemyRef.hp/bossEnemyRef.maxHp)+'%';
  } else {
    bossWrapEl.classList.remove('show');
    multiBossEl.classList.remove('show');
  }

  const bannerEl = document.getElementById('banner');
  if(banner.timer>0){
    bannerEl.textContent = banner.text;
    bannerEl.style.opacity = Math.min(1, banner.timer*2.2);
    bannerEl.style.transform = `translate(-50%,-50%) scale(${1+ (0.6-banner.timer)*0.4})`;
  } else {
    bannerEl.style.opacity = 0;
  }


}

function showDeathScreen(){
  document.getElementById('finalStats').textContent =
    `Total kills: ${player.totalKills}  •  Best streak: ${player.killStreak}`;
  document.getElementById('deathScreen').style.display = 'flex';
}

// ---------- STAGE THUMBNAIL PREVIEWS ----------
// Each stage card shows a small live canvas with its own map and a tiny
// bot-controlled dot fighting a couple of enemies, mirroring the "bot
// plays behind the scenes" feel of the main menu - just shrunk down.
function makeThumbState(mapImg, kinds){
  return {
    mapImg,
    t: Math.random()*10,
    player: { x: 150, y: 80, ang: 0 },
    enemies: kinds.map((type,i) => ({
      type,
      x: 40 + i*70 + Math.random()*20,
      y: 30 + (i%2)*100 + Math.random()*20,
    })),
  };
}
const thumb1Canvas = document.getElementById('thumb1');
const thumb2Canvas = document.getElementById('bossThumbCube');
const thumb1Ctx = thumb1Canvas.getContext('2d');
const thumb2Ctx = thumb2Canvas.getContext('2d');
const thumbState1 = makeThumbState(IMG.map,  ['green','glob','green']);
const thumbState2 = makeThumbState(IMG.map2, ['glob','green','glob']);

function drawThumb(tctx, tcanvas, state, dt){
  state.t += dt;
  const w = tcanvas.width, h = tcanvas.height;
  tctx.clearRect(0,0,w,h);

  if(state.mapImg.loaded){
    tctx.drawImage(state.mapImg, 0, 0, w, h);
  } else {
    tctx.fillStyle = '#141d0f';
    tctx.fillRect(0,0,w,h);
  }

  // player wanders a slow lissajous path around the thumbnail
  const targetX = w/2 + Math.cos(state.t*0.4)*w*0.34;
  const targetY = h/2 + Math.sin(state.t*0.55)*h*0.32;
  const dx = targetX-state.player.x, dy = targetY-state.player.y;
  const d = Math.hypot(dx,dy) || 1;
  state.player.ang = Math.atan2(dy,dx);
  state.player.x += (dx/d)*36*dt;
  state.player.y += (dy/d)*36*dt;

  // enemies loosely give chase, like the real bot fight
  for(const e of state.enemies){
    const edx = state.player.x-e.x, edy = state.player.y-e.y;
    const ed = Math.hypot(edx,edy) || 1;
    if(ed > 30){ e.x += (edx/ed)*20*dt; e.y += (edy/ed)*20*dt; }
    e.x = clamp(e.x, 8, w-8); e.y = clamp(e.y, 8, h-8);

    const eImg = e.type==='green' ? IMG.green : IMG.glob;
    tctx.save();
    tctx.translate(e.x, e.y);
    if(eImg.loaded){ tctx.drawImage(eImg, -9, -9, 18, 18); }
    else { tctx.fillStyle = e.type==='green' ? '#2ecc40' : '#e6c419'; tctx.beginPath(); tctx.arc(0,0,6,0,Math.PI*2); tctx.fill(); }
    tctx.restore();
  }

  state.player.x = clamp(state.player.x, 8, w-8);
  state.player.y = clamp(state.player.y, 8, h-8);

  // little muzzle flash so it visibly reads as "shooting", not just walking
  if(Math.floor(state.t*3)%3===0){
    tctx.save();
    tctx.strokeStyle = 'rgba(255,224,90,.6)';
    tctx.lineWidth = 2;
    tctx.beginPath();
    tctx.moveTo(state.player.x, state.player.y);
    tctx.lineTo(state.player.x+Math.cos(state.player.ang)*22, state.player.y+Math.sin(state.player.ang)*22);
    tctx.stroke();
    tctx.restore();
  }

  const pImg = IMG.nice;
  tctx.save();
  tctx.translate(state.player.x, state.player.y);
  if(pImg.loaded){ tctx.drawImage(pImg, -10, -10, 20, 20); }
  else { tctx.fillStyle = '#39ff6e'; tctx.beginPath(); tctx.arc(0,0,7,0,Math.PI*2); tctx.fill(); }
  tctx.restore();
}

let thumbLastTime = performance.now();
function thumbLoop(now){
  const dt = Math.min(0.05, (now-thumbLastTime)/1000);
  thumbLastTime = now;
  if(stageSelect.classList.contains('show')){
    drawThumb(thumb1Ctx, thumb1Canvas, thumbState1, dt);
    drawThumb(thumb2Ctx, thumb2Canvas, thumbState2, dt);
  }
  requestAnimationFrame(thumbLoop);
}
requestAnimationFrame(thumbLoop);

// ---------- MUSIC ----------
// musics/elevator.mp3 loops in the background while the main menu is up.
// musics/game.mp3 no longer starts on PLAY / during the MATRIX intro - it
// now only kicks in once the player actually presses ENTER and wakes up
// into the real run, so the STAGE 1 intro screen stays on elevator/silence.
const musicElevator = new Audio('musics/elevator.mp3');
musicElevator.loop = true;
musicElevator.volume = musicVolume;

const musicGame = new Audio('musics/game.mp3');
musicGame.loop = true;
musicGame.volume = musicVolume;

// Stage 2's own background track.
const musicGame2 = new Audio('musics/game2.mp3');
musicGame2.loop = true;
musicGame2.volume = musicVolume;

// ---------- CUBE V2 TAUNTS ----------
const CUBE_TAUNTS=['SO EASY','IS THIS UR BEST','TOO SLOW','TRY HARDER','YOU CALL THAT A SHOT?'];
function cubeV2Taunt(){
  if(!cubeV2Ref || cubeDialogueActive || !player.alive) return;
  const box=document.getElementById('cubeDialogue');
  document.getElementById('cubeSpeaker').textContent='CUBE:';
  document.getElementById('cubeSubtitle').textContent=CUBE_TAUNTS[Math.floor(Math.random()*CUBE_TAUNTS.length)];
  box.classList.add('show');
  clearTimeout(cubeV2Taunt._hide);
  cubeV2Taunt._hide=setTimeout(()=>{ if(!cubeDialogueActive){box.classList.remove('show');document.getElementById('cubeSubtitle').textContent='';}},850);
}

// ---------- CUBE V2 DIALOGUE ----------
const divineMusic = new Audio('musics/Divine.mp3');
divineMusic.loop = false;
divineMusic.volume = musicVolume;

let cubeDialogueActive = false;
let cubeDialogueIndex = -1;
let cubeDialogueTimer = 0;
let cubeDialogueDone = false;

const CUBE_DIALOGUE = [
  {text:'Hello Cube', duration:1.7, silence:0.15},
  {text:'You made it this far…', duration:2.2, silence:0.35},
  {text:'You think that means you’re strong?', duration:2.5, silence:0.35},
  {text:'No.', duration:1.6, silence:0.65},
  {text:'It means I allowed you to.', duration:2.4, silence:0.45},
  {text:'', duration:1.1, silence:1.0},
  {text:'YOU WILL DIE TO ME.', duration:2.0, silence:0, divine:true}
];

function stopDivine(){
  divineMusic.pause();
  divineMusic.currentTime=0;
}

function startCubeDialogue(){
  if(cubeDialogueActive || cubeDialogueDone) return;
  cubeDialogueActive=true;
  cubeDialogueDone=false;
  cubeDialogueIndex=-1;
  cubeDialogueTimer=0.75;

  const box=document.getElementById('cubeDialogue');
  box.classList.add('show','silence');
  document.getElementById('cubeSpeaker').textContent='CUBE:';
  document.getElementById('cubeSubtitle').textContent='';

  // Music ducks hard during the speech/silence.
  currentGameMusic().volume=0.10*musicVolume;
}

function finishCubeDialogue(){
  cubeDialogueActive=false;
  cubeDialogueDone=true;
  cubeDialogueIndex=-1;
  document.getElementById('cubeDialogue').classList.remove('show','silence');
  document.getElementById('cubeSubtitle').textContent='';
  // Divine takes over after the speech and stays in control until the boss is gone.
  musicGame.volume=0; musicGame2.volume=0;
  divineMusic.volume=musicVolume;
  divineMusic.currentTime=0;
  const p=divineMusic.play();
  if(p && p.catch) p.catch(()=>{ window.addEventListener('pointerdown',()=>divineMusic.play().catch(()=>{}),{once:true}); window.addEventListener('keydown',()=>divineMusic.play().catch(()=>{}),{once:true}); });
}

function updateCubeDialogue(dt){
  if(!cubeDialogueActive) return;
  cubeDialogueTimer-=dt;
  if(cubeDialogueTimer>0) return;

  cubeDialogueIndex++;
  if(cubeDialogueIndex>=CUBE_DIALOGUE.length){
    finishCubeDialogue();
    return;
  }

  const line=CUBE_DIALOGUE[cubeDialogueIndex];
  const box=document.getElementById('cubeDialogue');
  document.getElementById('cubeSubtitle').textContent=line.text;
  box.classList.toggle('silence',!line.text);

  if(line.divine){
    musicGame.pause(); musicGame2.pause();
    musicGame.currentTime=0; musicGame2.currentTime=0;
    musicGame.volume=0; musicGame2.volume=0;
    divineMusic.pause();
    divineMusic.currentTime=0;
    divineMusic.volume=Math.max(0,Math.min(1,musicVolume));
    const playDivine=()=>divineMusic.play().catch(()=>{});
    playDivine();
    setTimeout(playDivine,120);
  }

  cubeDialogueTimer=line.duration+line.silence;
}

// Returns whichever gameplay track belongs to the stage currently being played.
function currentGameMusic(){
  return currentStage === 2 ? musicGame2 : musicGame;
}
// Stops stage 1's track and starts stage 2's, used on the automatic
// stage1 -> stage2 transition mid-run.
function switchToStage2Music(){
  musicGame.pause();
  musicGame.currentTime = 0;
  tryPlayMusic(musicGame2, () => playingReal && currentStage===2 && !paused);
}

// Once true, elevator.mp3 must never play again (menu-only track).
let gameStarted = false;

// Browsers block audio.play() until the user has interacted with the page.
// Try immediately; if that's blocked, retry on the first click/keypress.
// `guard` (optional) is re-checked right before the retry actually plays,
// so a track can be cancelled even if its "unlock" listener fires late.
function tryPlayMusic(audio, guard){
  const p = audio.play();
  if(p && p.catch){
    p.catch(() => {
      const resume = () => {
        if(guard && !guard()) return;
        audio.play().catch(()=>{});
      };
      window.addEventListener('pointerdown', resume, {once:true});
      window.addEventListener('keydown', resume, {once:true});
    });
  }
}

tryPlayMusic(musicElevator, () => !gameStarted); // starts as soon as the page loads (menu music)

// ---------- WAKE-UP-FROM-BLACK TRANSITION ----------
// Plays when ENTER is pressed: instantly snaps the screen to solid black,
// then fades it back out over ~1.8s, like the player's eyes opening as
// they wake up inside the simulation.
const wakeOverlay = document.getElementById('wakeOverlay');
function playWakeUpEffect(){
  wakeOverlay.style.transition = 'none';
  wakeOverlay.style.opacity = '1';
  // force reflow so the instant opacity:1 is committed before we re-enable
  // the transition and animate back down to 0
  void wakeOverlay.offsetWidth;
  wakeOverlay.style.transition = 'opacity 1.8s ease';
  requestAnimationFrame(() => { wakeOverlay.style.opacity = '0'; });
}

// ---------- MAIN MENU -> STAGE SELECT -> REAL GAME WIRING ----------
// 1) Main menu: bot plays behind the PLAY button, elevator music.
// 2) Hitting PLAY fades the menu out and shows the stage grid - the bot
//    KEEPS playing behind it, each card has its own live mini-preview.
//    Stage 2's card stays labeled "BOSS STAGE" (name hidden) until Stage 1
//    is completed, then reveals "CUBE V2".
// 3) Clicking an unlocked stage card immediately launches that run: fades
//    the grid out, plays the wake-up-from-black effect, starts the
//    stage's music, and hands control to the player for real (HUD
//    appears, fresh stats). Stage 2 immediately triggers the Cube V2
//    boss + dialogue - no extra title/ENTER screen or grind in between.
document.getElementById('ui').style.display = 'none';

// Flip the flag (and kill elevator) on pointerdown, which fires on the
// PLAY button itself BEFORE it bubbles up to window - this beats the
// fallback "resume" listener above to the punch, so there's no race
// where elevator sneaks back in for the same click that starts the game.
document.getElementById('playBtn').addEventListener('pointerdown', () => {
  gameStarted = true;
  musicElevator.pause();
  musicElevator.currentTime = 0;
});

document.getElementById('playBtn').addEventListener('click', () => {
  gameStarted=true; musicElevator.pause(); musicElevator.currentTime=0;
  openStageSelect();
});

// ---------- GAME LOOP ----------
function loop(now){
  const dt = Math.min(0.033, (now - lastTime)/1000);
  lastTime = now;
  if(!paused) update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
