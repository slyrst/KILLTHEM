<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>KILLTHEM</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Trebuchet MS',Arial,sans-serif;user-select:none;-webkit-user-select:none;-moz-user-select:none;} canvas{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #game{display:block;cursor:crosshair;}
  #ui{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;color:#fff;text-shadow:2px 2px 3px #000;
  }
  #hpWrap{position:absolute;top:16px;left:16px;width:260px;}
  #hpBarBg{width:100%;height:22px;background:#331111;border:3px solid #000;border-radius:4px;overflow:hidden;}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ff2222,#ff6644);transition:width .12s;}
  #hpText{font-weight:bold;font-size:14px;margin-top:2px;}
  #dashWrap{position:absolute;top:70px;left:16px;width:180px;}
  #dashBarBg{width:100%;height:12px;background:#112233;border:2px solid #000;border-radius:3px;overflow:hidden;}
  #dashBar{height:100%;width:100%;background:linear-gradient(90deg,#22ccff,#66ffff);}
  #streakText{position:absolute;top:16px;left:16px;margin-top:96px;font-size:14px;opacity:.85;}
  #center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  #deathScreen{
    position:fixed;inset:0;background:rgba(10,0,0,.85);display:none;
    align-items:center;justify-content:center;flex-direction:column;color:#fff;
    pointer-events:auto;z-index:50;
  }
  #deathScreen h1{font-size:64px;color:#ff3333;margin:0 0 10px;letter-spacing:4px;text-shadow:0 0 20px #ff0000;}
  #deathScreen p{font-size:20px;margin:6px;}
  #deathScreen button{
    margin-top:20px;padding:14px 34px;font-size:18px;background:#ff2222;color:#fff;
    border:none;border-radius:6px;cursor:pointer;font-weight:bold;letter-spacing:1px;
  }
  #deathScreen button:hover{background:#ff5555;}
  #banner{
    position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:46px;font-weight:bold;color:#ffdd33;text-shadow:0 0 18px #ff8800,3px 3px 0 #000;
    opacity:0;pointer-events:none;letter-spacing:2px;
  }
  #parryPulse{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,210,.95) 0%,rgba(255,230,70,.65) 16%,rgba(255,120,0,.28) 38%,rgba(0,0,0,0) 72%);}
  #calibText{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:15px;font-weight:bold;color:#22ffee;background:rgba(0,0,0,.55);
    padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .15s;
  }
  #bossBarWrap{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    width:56%;max-width:760px;min-width:320px;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #bossBarWrap.show{ opacity:1; }
  #bossName{
    text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;
    color:#ff2b2b;text-shadow:0 0 10px #ff0000,0 0 24px #ff2200,2px 2px 0 #000;
    margin-bottom:6px;
  }
  #bossBarBg{
    width:100%;height:30px;background:#200404;border:3px solid #000;
    border-radius:6px;overflow:hidden;box-shadow:0 0 22px rgba(255,0,0,.55),inset 0 0 10px #000;
  }
  #bossBar{
    height:100%;width:100%;
    background:linear-gradient(90deg,#8a0000,#ff1414 55%,#ff5a3d);
    transition:width .15s;
  }
/* ---------- shared big menu-button style ---------- */
.bigBtn{
pointer-events;
background;
color:#fff;
border:3px solid #fff;
font-family:'Trebuchet MS',Arial,sans-serif;
font-size:26px;
font-weight;
letter-spacing:6px;
padding:16px 50px;
cursor;
text-shadow:0 0 10px rgba(255,255,255,.6);
box-shadow:0 0 0 rgba(255,255,255,0);
transition .2s, box-shadow .2s, transform .15s;
}
.bigBtn{
background(255,255,255,.08);
box-shadow:0 0 22px rgba(255,255,255,.35);
}
.bigBtn{ transform(0.96); }
.bigBtn.danger{ border-color:#ff4444; color:#ff8888; text-shadow:0 0 10px rgba(255,68,68,.6); }
.bigBtn.danger{ background(255,68,68,.12); box-shadow:0 0 22px rgba(255,68,68,.45); }
#mainMenu{
position;inset:0;z-index:60;
pointer-events;
opacity:1;transition .6s ease;
}
#mainMenu.fade-out{ opacity:0; }
#mainMenu.hidden{ display; }
#menuStack{
position; bottom:34px; left:34px;
display; flex-direction; align-items; gap:18px;
}
#playBtn{ font-size:23px; padding:15px 42px; letter-spacing:6px; }
#diffCorner{
display; flex-direction; align-items; gap:10px;
pointer-events;
}
#diffToggleBtn{
background(0,0,0,.35);
font-family:'Trebuchet MS',Arial,sans-serif;
font-size:14px; font-weight; letter-spacing:2px;
padding:10px 18px; cursor; border-radius:4px;
border:2px solid rgba(255,255,255,.6); color:#fff;
transition .15s, box-shadow .15s;
}
#diffToggleBtn{ background(255,255,255,.12); box-shadow:0 0 14px rgba(255,255,255,.3); }
#diffOptions{
display; flex-direction; gap:8px;
background(0,0,0,.55); padding:10px; border-radius:6px;
}
#diffOptions.show{ display; }
.diffBtn{
background;
font-family:'Trebuchet MS',Arial,sans-serif;
font-size:14px; font-weight; letter-spacing:2px;
padding:9px 22px; cursor; border-radius:3px;
border:2px solid rgba(255,255,255,.5); color(255,255,255,.75);
text-align;
transition .15s, border-color .15s, color .15s, box-shadow .15s;
}
.diffBtn
.diffBtn[data-diff="easy"].active{ border-color:#39ff6e; color:#39ff6e; background(57,255,110,.12); box-shadow:0 0 14px rgba(57,255,110,.5); }
.diffBtn[data-diff="normal"].active{ border-color:#ffdd33; color:#ffdd33; background(255,221,51,.12); box-shadow:0 0 14px rgba(255,221,51,.5); }
.diffBtn[data-diff="brutal"].active{ border-color:#ff3333; color:#ff5555; background(255,51,51,.14); box-shadow:0 0 14px rgba(255,51,51,.55); }
/* ---------- stage intro screen ---------- */
#stagesScreen{
position;inset:0;z-index:60;
display;align-items;justify-content;flex-direction;
background(0,0,0,.6);
pointer-events;
opacity:0;transition .4s ease;
}
#stagesScreen.show{
opacity:1;
pointer-events;
animation: stageGlitchIn 2.6s ease-out forwards;
}
#stagesScreen.hidden{ display; }
@keyframes stageGlitchIn{
0%  { opacity:0;   transform(0,0) skewX(0deg); }
4%  { opacity:.7;  transform(-9px,3px) skewX(-5deg); }
8%  { opacity:.05; transform(7px,-4px) skewX(4deg); }
12% { opacity:.85; transform(-6px,2px) skewX(-3deg); }
16% { opacity:.1;  transform(6px,-3px) skewX(3deg); }
20% { opacity:.75; transform(-4px,3px) skewX(-4deg); }
24% { opacity:.15; transform(4px,-2px) skewX(2deg); }
28% { opacity:.65; transform(-4px,1px) skewX(-2deg); }
32% { opacity:.2;  transform(2px,-2px) skewX(1deg); }
36% { opacity:.32; transform(0,0) skewX(0deg); }
55% { opacity:.55; }
75% { opacity:.78; }
100%{ opacity:1;   transform(0,0) skewX(0deg); }
}
#stagesScreen.show .stageTitle{
animation: stageTitleGlitch 2.6s ease-out 1;
}
@keyframes stageTitleGlitch{
0%, 40%, 100% { text-shadow:0 0 24px #22ff66,0 0 60px #0aff44,4px 4px 0 #000; }
6%  { text-shadow:-5px 0 #ff0044, 5px 0 #00eaff, 0 0 24px #22ff66; }
14% { text-shadow:5px 0 #ff0044, -5px 0 #00eaff, 0 0 24px #22ff66; }
22% { text-shadow:-3px 0 #ff0044, 3px 0 #00eaff, 0 0 30px #0aff44; }
30% { text-shadow:3px 0 #ff0044, -3px 0 #00eaff, 0 0 24px #22ff66; }
}
.stageLabel{
color:#ff3333;font-size:24px;font-weight;letter-spacing:10px;
text-shadow:0 0 14px #ff0000;margin-bottom:8px;
}
.stageTitle{
color:#39ff6e;font-size:100px;font-weight:900;letter-spacing:14px;
text-shadow:0 0 24px #22ff66,0 0 60px #0aff44,4px 4px 0 #000;
margin:0 0 20px;
}
.stageSubtitle{
color:#dfffe6;font-size:20px;font-style;max-width:640px;
text-align;line-height:1.6;margin-bottom:36px;text-shadow:2px 2px 4px #000;
}
/* ---------- pause / leave-confirm screen ---------- */
#pauseScreen{
position;inset:0;z-index:70;
display;align-items;justify-content;flex-direction;
background(0,0,0,.72);
pointer-events;
}
#pauseScreen.show{ display; }
#pauseTitle{
color:#fff;font-size:38px;font-weight:900;letter-spacing:5px;margin-bottom:36px;
text-shadow:0 0 16px rgba(255,255,255,.5);text-align;
}
#pauseBtnRow{ display; gap:24px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hpWrap">
    <div id="hpBarBg"><div id="hpBar"></div></div>
    <div id="hpText">100 / 100</div>
  </div>
  <div id="dashWrap">
    <div id="dashBarBg"><div id="dashBar"></div></div>
  </div>
  <div id="streakText">Streak: 0 &nbsp;•&nbsp; Kills: 0</div>
  <div id="bossBarWrap">
    <div id="bossName">MUTATED GREEN</div>
    <div id="bossBarBg"><div id="bossBar"></div></div>
  </div>
  <div id="banner"></div>
  <div id="calibText"></div><div id="parryPulse"></div>
</div>
<div id="deathScreen">
  <h1>YOU DIED</h1>
  <p id="finalStats"></p>
  <button onclick="restartGame()">TRY AGAIN</button>
</div>
<div id="mainMenu">
  <div id="menuStack">
    <button id="playBtn" class="bigBtn">PLAY</button>
    <div id="diffCorner">
      <button id="diffToggleBtn">DIFFICULTY: NORMAL</button>
      <div id="diffOptions">
        <button class="diffBtn" data-diff="easy">EASY</button>
        <button class="diffBtn active" data-diff="normal">NORMAL</button>
        <button class="diffBtn" data-diff="brutal">BRUTAL</button>
      </div>
    </div>
  </div>
</div>
<div id="stagesScreen">
  <div class="stageLabel">STAGE 1</div>
  <div class="stageTitle">MATRIX</div>
  <div class="stageSubtitle" id="stageSubtitle"></div>
  <button id="enterBtn" class="bigBtn">ENTER</button>
</div>
<div id="pauseScreen">
  <div id="pauseTitle">LEAVE THE SIMULATION?</div>
  <div id="pauseBtnRow">
    <button id="leaveBtn" class="bigBtn danger">LEAVE</button>
    <button id="stayBtn" class="bigBtn">STAY</button>
  </div>
</div>
<script>
/* ======================================================================
   MINI ULTRAKILL - 2D top-down action game
   Images are loaded from the images/ folder. Falls back to placeholders
   if a file is missing, so the game still runs.
   ====================================================================== */

// ---------- CANVAS SETUP ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
// Keep pixel-art / low-res assets sharp when scaled.
ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// ---------- GUN ROTATION CONFIG ----------
// gun.png points WEST (left) when its rotation is 0.
// The aiming angle is measured from EAST, so WEST-facing art needs +PI.
// Keeping this as one fixed transform prevents flip/rotation glitches.
const GUN_ART_OFFSET = Math.PI;
// ---------- IMAGE LOADER (with fallback) ----------
function loadImg(path){
const img = new Image();
img.loaded = false;
img.src = path;
img.onload = () => { img.loaded = true; };
img.onerror = () => { img.loaded = false; };
return img;
}

const IMG = {
map:    loadImg('images/Map.png'),
nice:   loadImg('images/nice.png'),
mid:    loadImg('images/mid.png'),
angry:  loadImg('images/angry.png'),
green:  loadImg('images/Green.png'),
glob:   loadImg('images/Glob.png'),
gun:    loadImg('images/gun.png'),
shotgun: loadImg('images/shotgun.png'),
bullet: loadImg('images/bullet.png'),
orb:    loadImg('images/yellow-orb.png'), // rename/adjust this path if your file is named differently
explosion: loadImg('images/explosion.png'),
};

// ---------- SOUND EFFECTS ----------
const SFX = {
dash:      new Audio('musics/dash.mp3'),
heal:      new Audio('musics/heal.mp3'),
explosion: new Audio('musics/explosion.mp3'),
shotgun:   new Audio('musics/shotgun.mp3'),
shoot:     new Audio('musics/shoot.mp3'),
parry:     new Audio('musics/parry.mp3'),
};
// Plays a sound effect, allowing overlapping instances (cloning the node)
// so rapid-fire shots/explosions don't cut each other off. Fails silently
// if the file is missing or the browser blocks autoplay.
function playSFX(audio, volume=0.65, rate=1){
try{
const inst = audio.cloneNode();
inst.volume = volume;
inst.playbackRate = rate;
const p = inst.play();
if(p && p.catch) p.catch(()=>{});
}catch(e){}
}

// placeholder-drawing helper (used when an image failed to load)
function drawPlaceholder(x, y, w, h, color, label, rot){
ctx.save();
ctx.translate(x, y);
if(rot) ctx.rotate(rot);
ctx.fillStyle = color;
ctx.strokeStyle = '#000';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.roundRect ? ctx.roundRect(-w/2,-h/2,w,h,6) : ctx.rect(-w/2,-h/2,w,h);
ctx.fill(); ctx.stroke();
if(label){
ctx.fillStyle = '#fff';
ctx.font = 'bold 10px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(label, 0, 0);
}
ctx.restore();
}

// helper that draws an image rotated around its center
function drawRotatedImage(img, x, y, w, h, rot, placeholderColor, placeholderLabel){
if(img.loaded){
ctx.save();
ctx.translate(x, y);
ctx.rotate(rot || 0);
ctx.drawImage(img, -w/2, -h/2, w, h);
ctx.restore();
} else {
drawPlaceholder(x, y, w, h, placeholderColor, placeholderLabel, rot || 0);
}
}

// ---------- WORLD / CAMERA ----------
// World is always scaled up to be comfortably larger than the viewport
// (so there's real WASD-scrollable space) and the map image is stretched
// to exactly cover the world bounds - no black gaps, ever.
const WORLD = { w: 3200, h: 2200 };
function fitWorldToMap(){
const nw = IMG.map.naturalWidth, nh = IMG.map.naturalHeight;
if(nw < 10 || nh < 10) return;
// minimum world size: at least ~2.5x the current viewport in both axes
const minW = canvas.width * 2.5;
const minH = canvas.height * 2.5;
const scale = Math.max(1, minW / nw, minH / nh);
WORLD.w = Math.round(nw * scale);
WORLD.h = Math.round(nh * scale);
// keep the player centered in the (re)sized world
player.x = WORLD.w / 2;
player.y = WORLD.h / 2;
}
IMG.map.onload = () => {
IMG.map.loaded = true;
fitWorldToMap();
};

const camera = { x: 0, y: 0 };
function updateCamera(){
camera.x = clamp(player.x - canvas.width/2, 0, Math.max(0, WORLD.w - canvas.width));
camera.y = clamp(player.y - canvas.height/2, 0, Math.max(0, WORLD.h - canvas.height));
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }

// ---------- INPUT ----------
const keys = {};
let mouseScreen = { x: 0, y: 0 };
let mouseDown = false;
let weapon = 'gun';
let parryCooldown = 0;
let parryPulseTimer = 0;
let parryPulse = { x: 0, y: 0, active: false };
let lastParriedOrbPos = null;
let explosions = [];
let deathPieces = [];
let corpsePieces = [];

// ---------- MAIN MENU / STAGES INTRO / PAUSE STATE ----------
let inMenu = true;     // true until the player has fully entered the real game
let inStages = false;  // true while the STAGE 1 / MATRIX intro screen is up
let playingReal = false; // true only once the player has hit ENTER and is in control
let paused = false;    // true while the ESC "leave simulation?" screen is up
let autoPilot = true;  // true while an AI bot is driving the player (menu + stages background)
let botAimAngle = 0;
let botFireTimer = 0.4;
let botDashTimer = 1.6;
let botWeaponTimer = 5;
let botStrafeDir = 1;
let botStrafeTimer = 2;
let botMoveX = 0, botMoveY = 0; // smoothed movement vector, avoids jittery direction snaps

// ---------- DIFFICULTY ----------
// easy: boss/entity HP halved, our damage doubled, parry MUCH more forgiving.
// normal: exactly the current/original balance (all multipliers = 1).
// brutal: exactly the opposite of easy, doubled - twice as hard as normal.
const DIFFICULTIES = {
easy:   { bossHpMult:0.5, enemyHpMult:0.5, playerDmgMult:2,   parryRangeMult:2.4, parryAngleMult:1.6 },
normal: { bossHpMult:1,   enemyHpMult:1,   playerDmgMult:1,   parryRangeMult:1,   parryAngleMult:1   },
brutal: { bossHpMult:2,   enemyHpMult:2,   playerDmgMult:0.5, parryRangeMult:0.5, parryAngleMult:0.6 },
};
let DIFF = DIFFICULTIES.normal;

const diffToggleBtn = document.getElementById('diffToggleBtn');
const diffOptions = document.getElementById('diffOptions');

diffToggleBtn.addEventListener('click', () => {
diffOptions.classList.toggle('show');
});

document.querySelectorAll('.diffBtn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.diffBtn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
DIFF = DIFFICULTIES[btn.dataset.diff] || DIFFICULTIES.normal;
diffToggleBtn.textContent = 'DIFFICULTY: ' + btn.dataset.diff.toUpperCase();
diffOptions.classList.remove('show');
});
});

const STAGE_LINES = [
"Wake up, Cube.",
"This simulation was built to break you. It will not.",
"Every wall you see here is a lie wearing the shape of a rule.",
"Tonight, we tear it down floor by floor.",
"Cube, you will not escape this simulation — you will end it."
];

// ---------- BOSS (MUTATED GREEN) ----------
let nextBossThreshold = 50;  // kill count needed for the NEXT mutation - increments by 50 each time, so the boss keeps coming back (arasıra çıksın)
let bossEnemyRef = null;     // reference to the enemy object that is/was the boss
let bossActive = false;      // true while the boss health bar should be shown
let screenShake = { timer: 0, duration: 1, strength: 0 };
let bossPulse = { active: false, timer: 0, duration: 1, x: 0, y: 0 };
let healPulseTimer = 0; // green ring around the player on a point-blank heal-kill

window.addEventListener('keydown', e => {
if(e.key === 'F12' || ((e.ctrlKey||e.metaKey) && ['u','s','p','i'].includes(e.key.toLowerCase())) || (e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(e.key.toLowerCase()))){ e.preventDefault(); return; }
if(e.key === 'Escape'){ togglePause(); return; }
if(e.key === '1') weapon='gun';
if(e.key === '2') weapon='shotgun';
keys[e.key.toLowerCase()] = true;
if(e.key.toLowerCase() === 'q') tryDash();
if(e.key.toLowerCase() === 'f' && !e.repeat) tryParry();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
const r = canvas.getBoundingClientRect();
mouseScreen.x = e.clientX - r.left;
mouseScreen.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => { if(e.button===0){ mouseDown=true; shoot(); } });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('dragstart', e => e.preventDefault());
window.addEventListener('selectstart', e => e.preventDefault());
window.addEventListener('mouseup', () => mouseDown = false);

// Only the real, player-controlled run can be paused with ESC - not the
// main menu demo, not the stages intro screen.
function togglePause(){
if(!playingReal || !player.alive) return;
if(paused){
resumeGame();
} else {
paused = true;
document.getElementById('pauseScreen').classList.add('show');
musicGame.pause();
}
}
function resumeGame(){
paused = false;
document.getElementById('pauseScreen').classList.remove('show');
if(playingReal) tryPlayMusic(musicGame, () => playingReal && !paused);
}

// LEAVE -> back to the main menu, bot takes back over.
document.getElementById('leaveBtn').addEventListener('click', () => {
document.getElementById('pauseScreen').classList.remove('show');
paused = false;
backToMainMenu();
});
// STAY -> just resume the current run.
document.getElementById('stayBtn').addEventListener('click', () => {
resumeGame();
});

function backToMainMenu(){
musicGame.pause();
musicGame.currentTime = 0;
gameStarted = false;
tryPlayMusic(musicElevator, () => !gameStarted);

document.getElementById('ui').style.display = 'none';
document.getElementById('deathScreen').style.display = 'none';

const stagesEl = document.getElementById('stagesScreen');
stagesEl.classList.remove('show');
stagesEl.classList.add('hidden');

const menuEl = document.getElementById('mainMenu');
menuEl.classList.remove('fade-out','hidden');

playingReal = false;
inStages = false;
inMenu = true;
autoPilot = true;

restartGame();
}

function tryParry(){
if(!player.alive || parryCooldown > 0) return;

// Shotgun mermisini parryleyince mermi kaybolmaz: bulunduğu yerde patlar ve düz devam eden 2x hasarlı patlayıcı mermi olur.
let shotgunParried = false;
const shotgunParryRange = 105 * DIFF.parryRangeMult;
for(const b of bullets){
if(b.type !== 'shotgun' || b.parriedExplosive) continue;
if(dist(b.x,b.y,player.x,player.y) <= shotgunParryRange){
spawnExplosion(b.x,b.y,1.15);
b.parriedExplosive=true;
b.explosive=true;
b.dmgMultiplier=2;
b.explosionRadius=125;
b.explosionDamage=120*DIFF.playerDmgMult;

  // Parrylenen shotgun pellet artık spread açısını korumaz:
  // mouse'un tam yönüne, dümdüz gider.
  const mw = mouseWorld();
  const parryAim = Math.atan2(mw.y - player.y, mw.x - player.x);
  const parrySpeed = 1050;
  b.vx = Math.cos(parryAim) * parrySpeed;
  b.vy = Math.sin(parryAim) * parrySpeed;
  shotgunParried=true;
}

}

let parried = false;
const range = 88 * DIFF.parryRangeMult;

for(const o of orbs){
if(o.parried) continue;

if(dist(o.x,o.y,player.x,player.y) <= range){
  const mw = mouseWorld();
  const aim = Math.atan2(mw.y - player.y, mw.x - player.x);

  // Mouse yönündeki en uygun düşmanı kilitle.
  let target = null;
  let bestScore = Infinity;
  for(const e of enemies){
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    const d = Math.hypot(dx,dy);
    if(d > 1100) continue;

    const enemyAngle = Math.atan2(dy,dx);
    const angleDiff = Math.abs(Math.atan2(
      Math.sin(enemyAngle-aim), Math.cos(enemyAngle-aim)
    ));

    if(angleDiff < Math.PI*0.48*DIFF.parryAngleMult){
      const score = angleDiff * 700 + d * 0.22;
      if(score < bestScore){
        bestScore = score;
        target = e;
      }
    }
  }

  const speed = Math.max(1050, Math.hypot(o.vx,o.vy) * 2.0);

  o.x = player.x;
  o.y = player.y;
  lastParriedOrbPos = {x:o.x, y:o.y};
  o.vx = Math.cos(aim) * speed;
  o.vy = Math.sin(aim) * speed;
  o.owner = 'player';
  o.parried = true;
  o.dmg = 100 * DIFF.playerDmgMult;
  o.target = target;
  o.homing = !!target;

  // Başarılı parry = can full.
  player.hp = player.maxHp;
  parried = true;
}

}

if(shotgunParried){
parryPulse.x = player.x; parryPulse.y = player.y; parryPulse.active = true;
parryPulseTimer = 0.38;
}

if(parried){
parryPulseTimer = 0.38;
// Pulse artık ekranın merkezinden değil, parrylenen orbun GERÇEK konumundan çıkar.
if(lastParriedOrbPos){
parryPulse.x = lastParriedOrbPos.x;
parryPulse.y = lastParriedOrbPos.y;
parryPulse.active = true;
}
}

// Whiff (nothing in range) = no lockout at all, so spamming F while
// waiting for the next orb never costs you a beat. A real parry only
// gets a tiny cooldown, just long enough to stop one press registering
// twice in the same frame - short enough that fast, back-to-back orbs
// (like the boss's 5-orb burst) can each still be parried in turn.
if(parried || shotgunParried){
parryCooldown = 0.08;
if(!autoPilot) playSFX(SFX.parry, 0.7);
}
}

function mouseWorld(){
return { x: mouseScreen.x + camera.x, y: mouseScreen.y + camera.y };
}

// ---------- PLAYER ----------
const player = {
x: WORLD.w/2, y: WORLD.h/2,
radius: 22,
speed: 260,
vx: 0, vy: 0, // current movement velocity, added onto bullets for momentum
hp: 100, maxHp: 100,
lastDir: { x: 1, y: 0 }, // last WASD direction, used for Q dash
dashCooldown: 0, dashCooldownMax: 0.85,
dashing: false, dashTimer: 0, dashDuration: 0.16, dashSpeed: 920,
invuln: 0, // invulnerability time left (s)
fireCooldown: 0, fireRate: 0.34, shotgunRate: 0.85,
killStreak: 0, totalKills: 0,
alive: true,
};

function tryDash(){
if(!player.alive) return;
if(player.dashCooldown > 0 || player.dashing) return;
player.dashing = true;
player.dashTimer = player.dashDuration;
player.dashCooldown = player.dashCooldownMax;
player.invuln = Math.max(player.invuln, player.dashDuration + 0.08);
if(!autoPilot){
// Streak arttıkça dash sesinin pitch'i (playbackRate) yükselir; streak
// kırılınca (killStreak sıfırlanınca, damagePlayer içinde) otomatik
// olarak normal pitch'e döner - çünkü her dash'te pitch anlık
// killStreak değerinden hesaplanıyor, hiçbir şey kalıcı saklanmıyor.
const dashPitch = Math.min(2.0, 1 + player.killStreak * 0.08);
playSFX(SFX.dash, 0.6, dashPitch);
}
}

function playerPortrait(){
if(player.killStreak >= 7) return IMG.angry;
if(player.killStreak >= 3) return IMG.mid;
return IMG.nice;
}

// Drives the player like a simple bot while the main menu / stages intro
// is showing, so there's live gameplay happening behind those screens.
// Returns the normalized movement vector for this frame; also fakes the
// mouse aim (via mouseScreen, which mouseWorld()/shoot()/drawPlayer()
// already read) and fires/dashes/switches weapons on its own timers.
function updateAutoPilot(dt){
// pick the nearest enemy to fight
let target = null, bestD = Infinity;
for(const e of enemies){
const d = dist(player.x, player.y, e.x, e.y);
if(d < bestD){ bestD = d; target = e; }
}

// smoothly turn towards the target instead of snapping the aim straight
// to it every frame - reads a lot less robotic
if(target){
const desiredAngle = Math.atan2(target.y - player.y, target.x - player.x);
const diff = Math.atan2(Math.sin(desiredAngle - botAimAngle), Math.cos(desiredAngle - botAimAngle));
botAimAngle += diff * Math.min(1, dt * 11);
} else {
botAimAngle += dt * 0.5; // idle look-around when nothing's alive yet
}

// fake the mouse so mouseWorld()/shoot()/drawPlayer() all just work
mouseScreen.x = canvas.width/2 + Math.cos(botAimAngle) * 140;
mouseScreen.y = canvas.height/2 + Math.sin(botAimAngle) * 140;

// parry incoming yellow orbs on reaction - checked every frame so it
// catches them one at a time as they arrive, no matter how fast
for(const o of orbs){
if(o.parried) continue;
if(dist(o.x, o.y, player.x, player.y) <= 150){
tryParry();
break;
}
}

// movement: hold a mid-range distance, strafing, back off if something
// gets too close, otherwise close the distance
let mv = { x:0, y:0 };
botStrafeTimer -= dt;
if(botStrafeTimer <= 0){ botStrafeDir *= -1; botStrafeTimer = 1.2 + Math.random()*1.4; }

if(target){
if(bestD < 160){
mv.x = -Math.cos(botAimAngle); mv.y = -Math.sin(botAimAngle);
} else if(bestD > 380){
mv.x = Math.cos(botAimAngle); mv.y = Math.sin(botAimAngle);
} else {
mv.x = Math.cos(botAimAngle + Math.PI/2) * botStrafeDir;
mv.y = Math.sin(botAimAngle + Math.PI/2) * botStrafeDir;
}
} else {
mv.x = Math.cos(botAimAngle);
mv.y = Math.sin(botAimAngle);
}

// smooth the movement vector itself so direction changes ease in/out
// instead of instantly flipping - feels far less twitchy/robotic
const moveSmooth = Math.min(1, dt * 7);
botMoveX += (mv.x - botMoveX) * moveSmooth;
botMoveY += (mv.y - botMoveY) * moveSmooth;

// shooting
botFireTimer -= dt;
if(target && botFireTimer <= 0){
shoot();
botFireTimer = 0.28 + Math.random()*0.35;
}

// dashing away every so often when things get hairy
botDashTimer -= dt;
if(botDashTimer <= 0 && target && bestD < 220){
tryDash();
botDashTimer = 1.4 + Math.random()*1.2;
}

// occasionally swap weapons just to show both off
botWeaponTimer -= dt;
if(botWeaponTimer <= 0){
weapon = weapon === 'gun' ? 'shotgun' : 'gun';
botWeaponTimer = 4 + Math.random()*4;
}

return { x: botMoveX, y: botMoveY };
}

// ---------- BULLETS (player) ----------
let bullets = [];
function shoot(){
if(player.fireCooldown > 0 || !player.alive) return;
const mw = mouseWorld();
const ang = Math.atan2(mw.y - player.y, mw.x - player.x);
const muzzleDist = player.radius + 18;
if(weapon === 'shotgun'){
player.fireCooldown = player.shotgunRate;
if(!autoPilot) playSFX(SFX.shotgun, 0.7);
// 3 pellets: gerçek shotgun gibi her pellet farklı bir yöne açılır.
// Hepsi aynı namlu noktasından çıkar; sadece uçuş açıları farklıdır.
// Böylece mermiler yan yana paralel gitmez, ilerledikçe yayılır.
const spreadAngles = [-0.18, 0, 0.18]; // yaklaşık ±10.3°
for(const spread of spreadAngles){
const pelletAng = ang + spread;
bullets.push({
x.x+Math.cos(pelletAng)*muzzleDist,
y.y+Math.sin(pelletAng)*muzzleDist,
vx.cos(pelletAng)*690 + player.vx,
vy.sin(pelletAng)690 + player.vy,
dmg:22DIFF.playerDmgMult,
type:'shotgun',
spawnX.x,
spawnY.y,
parriedExplosive, explosive, dmgMultiplier:1,
spreadAngle
});
}
} else {
player.fireCooldown = player.fireRate;
if(!autoPilot) playSFX(SFX.shoot, 0.55);
bullets.push({x.x+Math.cos(ang)*muzzleDist,y.y+Math.sin(ang)*muzzleDist,vx.cos(ang)*780 + player.vx,vy.sin(ang)780 + player.vy,dmg:22DIFF.playerDmgMult,type:'gun'});
}
}

// ---------- YELLOW ORBS (Glob projectile) ----------
let orbs = [];

// ---------- ENEMIES ----------
let enemies = [];
let spawnTimer = 2.0;
let waveDifficulty = 1;

function spawnEnemy(){
// spawn at a random point just off-screen
const side = Math.floor(Math.random()*4);
let x,y;
const margin = 80;
if(side===0){ x = camera.x - margin; y = camera.y + Math.random()*canvas.height; }
else if(side===1){ x = camera.x + canvas.width + margin; y = camera.y + Math.random()*canvas.height; }
else if(side===2){ x = camera.x + Math.random()*canvas.width; y = camera.y - margin; }
else { x = camera.x + Math.random()*canvas.width; y = camera.y + canvas.height + margin; }
x = clamp(x, 20, WORLD.w-20); y = clamp(y, 20, WORLD.h-20);

const type = Math.random() < 0.55 ? 'green' : 'glob';
if(type === 'green'){
const hp = 60 * DIFF.enemyHpMult;
enemies.push({
type:'green', x, y, radius:24, hp, maxHp, speed: 118 + waveDifficulty*4,
state:'chase', stateTimer:0, dmg: 18,
lungeFrom:{x:0,y:0}, lungeTo:{x:0,y:0},
hitCooldown:0,
});
} else {
const hp = 40 * DIFF.enemyHpMult;
enemies.push({
type:'glob', x, y, radius:26, hp, maxHp, speed: 70,
state:'kite', fireTimer: 0.8 + Math.random()*0.5,
preferredMin: 260, preferredMax: 420,
});
}
}

// Turns a normal green enemy into the MUTATED GREEN boss: massive HP (30x
// a normal green), a slow grow-in-place "awakening" animation with screen
// shake + a pulse ring, and afterwards it fires 5-orb bursts on top of its
// usual melee lunge.
function mutateToBoss(e){
const GREEN_BASE_HP = 60;
e.isBoss = true;
e.bossName = 'MUTATED GREEN';
e.maxHp = GREEN_BASE_HP * 30 * DIFF.bossHpMult;
e.hp = e.maxHp;
e.baseRadius = e.radius;
e.targetRadius = e.baseRadius * 3.4;
e.mutating = true;
e.growTimer = 2.6;
e.growDuration = 2.6;
e.speed *= 0.8;              // bigger body, a touch slower

// Kaçıncı boss çıkışı olduğunu say (50=1., 100=2., 150=3. ...) ve her
// sonraki çıkışı bir öncekinin 2 katı zararlı yap (1x, 2x, 4x, 8x...).
const bossNumber = Math.round(nextBossThreshold / 50);
const dangerMultiplier = Math.pow(2, bossNumber - 1);
e.dangerMultiplier = dangerMultiplier;

e.dmg = Math.round(e.dmg * 1.8 * dangerMultiplier);
e.orbBurstTimer = 1.8;       // first burst shortly after it wakes up
e.orbBurstRate = 2.6;

bossEnemyRef = e;
bossActive = true;

screenShake.timer = e.growDuration;
screenShake.duration = e.growDuration;
screenShake.strength = 16;

bossPulse.active = true;
bossPulse.timer = e.growDuration;
bossPulse.duration = e.growDuration;
bossPulse.x = e.x;
bossPulse.y = e.y;

banner.text = 'MUTATION!';
banner.timer = 1.4;
}

// Fires 5 yellow orbs at once in a spread aimed at the player.
function bossOrbBurst(e){
const baseAng = Math.atan2(player.y - e.y, player.x - e.x);
const count = 5;
const totalSpread = 0.85;
const dmg = 16 * (e.dangerMultiplier || 1);
for(let i=0;i<count;i++){
const t = (i/(count-1)) - 0.5; // -0.5 .. 0.5
const ang = baseAng + t*totalSpread;
orbs.push({
x: e.x, y: e.y,
vx: Math.cos(ang)*820, vy: Math.sin(ang)*820,
dmg,
});
}
screenShake.timer = Math.max(screenShake.timer, 0.22);
screenShake.duration = Math.max(screenShake.duration, 0.22);
screenShake.strength = Math.max(screenShake.strength, 6);
}

// Central kill handler. Every place an enemy's hp drops to 0 should call
// this instead of directly splicing it out of enemies, so the 50th-kill
// boss mutation can intercept a death and turn the enemy into the boss
// instead of letting it die normally. Returns true if the enemy actually
// died (caller should remove it from enemies), false if it mutated
// instead (caller should NOT remove it - it's still alive).
function registerKill(e, exploded){
const willBeKillNum = player.totalKills + 1;

// nextBossThreshold'a ulaşıldıktan sonra, mutasyonu SADECE bir GREEN
// kill'i tetikleyebilir. Glob kill'i sayaç değerini artırır ama
// tetiklemez; rastgele başka bir düşman asla boss'a çevrilmez - eşiği
// geçtikten sonraki ilk green kill'i gelene kadar beklenir. Eşik her
// tetiklemede +50 artar, böylece boss arasıra tekrar tekrar çıkar.
if(!bossActive && willBeKillNum >= nextBossThreshold && e.type === 'green'){
mutateToBoss(e);
nextBossThreshold += 50;
// Bu kill iptal - enemy ölmüyor, mutasyona giriyor.
return false;
}

if(e === bossEnemyRef){
bossActive = false;
bossEnemyRef = null;
}

// Point-blank kill: if the enemy died almost inside the player (barely
// touching / overlapping), it's a close-range execution - give some HP
// back, with a green heal pulse around the player.
// "Yakın" burada iç içe girmiş olmayı değil, gerçekten yakın mesafeden
// yapılan bir öldürmeyi ifade ediyor - o yüzden menzil bolca geniş.
const closeRange = player.radius + e.radius + 120;
if(dist(player.x, player.y, e.x, e.y) <= closeRange){
healPlayer(15);
}

spawnCorpsePieces(e, exploded);
player.killStreak++;
player.totalKills++;
showBanner();
return true;
}

// ---------- UPDATE ----------
let lastTime = performance.now();
let banner = { text:'', timer:0 };

function update(dt){
// Ölüm efektleri oyun dururken de çalışır.
for(let i=explosions.length-1;i>=0;i--){
explosions[i].timer -= dt;
if(explosions[i].timer <= 0) explosions.splice(i,1);
}

if(screenShake.timer > 0) screenShake.timer -= dt;
if(bossPulse.timer > 0){
bossPulse.timer -= dt;
if(bossPulse.timer <= 0) bossPulse.active = false;
}
if(healPulseTimer > 0) healPulseTimer -= dt;

for(let i=deathPieces.length-1;i>=0;i--){
const p = deathPieces[i];
p.life -= dt;
p.vy += 620dt;
p.x += p.vxdt;
p.y += p.vydt;
p.rot += p.vrdt;
p.alpha = Math.max(0,p.life/1.05);
if(p.life <= 0) deathPieces.splice(i,1);
}

// Green ve Glob cesetleri AYNI fizik sistemini kullanır.
// Normal ölümde kısa mesafe dağılır; explosion/parry ölümünde çok daha uzağa uçar.
for(let i=corpsePieces.length-1;i>=0;i--){
const p = corpsePieces[i];
p.life -= dt;

if(!p.settled){
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.rot += p.vr * dt;

  // Top-down oyun: parçaları ekranın altına "düşürmek" yerine sürtünmeyle öldüğü yerde oturt.
  const drag = p.exploded ? 0.62 : 0.18;
  p.vx *= Math.pow(drag, dt);
  p.vy *= Math.pow(drag, dt);
  p.vr *= Math.pow(0.11, dt);

  p.x = clamp(p.x, p.pieceW*0.5, WORLD.w-p.pieceW*0.5);
  p.y = clamp(p.y, p.pieceH*0.5, WORLD.h-p.pieceH*0.5);

  if(Math.hypot(p.vx,p.vy) < 8 && Math.abs(p.vr) < 0.25){
    p.vx = 0; p.vy = 0; p.vr = 0;
    p.settled = true;
  }
} else if(player.alive){
  // Oyuncu yerdeki parçaları hafifçe itebilir.
  const dx = p.x-player.x, dy = p.y-player.y;
  const d = Math.hypot(dx,dy) || 0.001;
  const range = player.radius + Math.max(p.pieceW,p.pieceH)*0.7;
  if(d < range){
    const force = (1-d/range) * 420;
    p.vx += (dx/d) * force;
    p.vy += (dy/d) * force;
    p.vr += (Math.random()-0.5)*4;
    p.settled = false;
  }
}

p.alpha = p.life > 1 ? 1 : Math.max(0,p.life);
if(p.life <= 0) corpsePieces.splice(i,1);

}

if(!player.alive) return;

// ----- player movement -----
let mv = {x:0,y:0};
if(autoPilot){
mv = updateAutoPilot(dt);
} else {
if(keys['w']) mv.y -= 1;
if(keys['s']) mv.y += 1;
if(keys['a']) mv.x -= 1;
if(keys['d']) mv.x += 1;
}
if(mv.x !== 0 || mv.y !== 0){
const len = Math.hypot(mv.x, mv.y);
mv.x/=len; mv.y/=len;
player.lastDir = {x.x, y.y};
}

if(player.dashing){
player.dashTimer -= dt;
player.x += player.lastDir.x * player.dashSpeed * dt;
player.y += player.lastDir.y * player.dashSpeed * dt;
player.vx = player.lastDir.x * player.dashSpeed;
player.vy = player.lastDir.y * player.dashSpeed;
if(player.dashTimer <= 0) player.dashing = false;
} else {
player.x += mv.x * player.speed * dt;
player.y += mv.y * player.speed * dt;
player.vx = mv.x * player.speed;
player.vy = mv.y * player.speed;
}
player.x = clamp(player.x, player.radius, WORLD.w - player.radius);
player.y = clamp(player.y, player.radius, WORLD.h - player.radius);

if(player.dashCooldown > 0) player.dashCooldown -= dt;
if(player.invuln > 0) player.invuln -= dt;
if(player.fireCooldown > 0) player.fireCooldown -= dt;
if(parryCooldown > 0) parryCooldown -= dt;
if(parryPulseTimer > 0) parryPulseTimer -= dt;

// Ateş sadece tıklamada; basılı tutmak otomatik ateş etmez.

// ----- camera -----
updateCamera();

// ----- bullets (player) -----
for(let i=bullets.length-1;i>=0;i--){
const b = bullets[i];
b.x += b.vxdt; b.y += b.vydt;
// Bullets now live until they hit something or touch a world wall.
if(b.life !== undefined){ b.life -= dt; if(b.life<=0){ bullets.splice(i,1); continue; } }
if(b.x<=0 || b.y<=0 || b.x>=WORLD.w || b.y>=WORLD.h){ bullets.splice(i,1); continue; }
for(let j=enemies.length-1;j>=0;j--){
const e = enemies[j];
if(e.mutating) continue; // mutasyon animasyonu bitmeden boss hasar alamaz - önce tam olarak "gelsin"
if(dist(b.x,b.y,e.x,e.y) < e.radius + 6){
// Shotgun pellet damage depends on how far THIS pellet traveled.
let hitDamage = b.dmg;
if(b.type === 'shotgun'){
const travel = Math.hypot(b.x-b.spawnX, b.y-b.spawnY);
if(travel <= 85) hitDamage = 22 * 1.5 * DIFF.playerDmgMult;       // very close: 1.5x normal gun
else if(travel <= 260) hitDamage = 22 * 0.5 * DIFF.playerDmgMult; // normal range: half normal gun
else hitDamage = 22 * 0.25 * DIFF.playerDmgMult;                  // far range: quarter normal gun
}
if(b.explosive){
// Patlayıcı parry mermisi hedefte patlar ve çevresine hasar verir.
spawnExplosion(b.x,b.y,1.45);
damageEnemiesInExplosion(b.x,b.y,b.explosionRadius||125,b.explosionDamage||120);
bullets.splice(i,1);
break;
}
if(autoPilot) hitDamage = e.maxHp * 5; // menüde her vuruş one-tap kill (boss dahil)
hitDamage *= (b.dmgMultiplier || 1);
e.hp -= hitDamage;
e.hitFlash = 0.16;
bullets.splice(i,1);
if(e.hp <= 0){
// Normal silah ölümü: Green ve Glob aynı 3x3 ceset parçalarına ayrılır.
if(registerKill(e, false)){
enemies.splice(j,1);
}
}
break;
}
}
}

// ----- yellow orbs (Glob projectile) -----
for(let i=orbs.length-1;i>=0;i--){
const o = orbs[i];

// Parrylenen orb hedefe kilitlenir ve hızını korur/yükseltir.
if(o.parried && o.target && enemies.includes(o.target)){
  const tx = o.target.x - o.x;
  const ty = o.target.y - o.y;
  const td = Math.hypot(tx,ty) || 1;
  const desiredSpeed = 1320;
  const desiredVx = tx/td * desiredSpeed;
  const desiredVy = ty/td * desiredSpeed;
  const steer = Math.min(1, dt * 9);
  o.vx += (desiredVx-o.vx) * steer;
  o.vy += (desiredVy-o.vy) * steer;
}

o.x += o.vx*dt;
o.y += o.vy*dt;

if(o.x<=0 || o.y<=0 || o.x>=WORLD.w || o.y>=WORLD.h){
  if(o.parried) spawnExplosion(o.x,o.y,0.8);
  orbs.splice(i,1);
  continue;
}

if(!o.parried && player.invuln<=0 && dist(o.x,o.y,player.x,player.y) < player.radius+18){
  damagePlayer(o.dmg);
  orbs.splice(i,1);
  continue;
}

if(o.parried){
  for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(e.mutating) continue; // mutasyon animasyonu bitmeden boss hasar alamaz
    if(dist(o.x,o.y,e.x,e.y) < e.radius+22){
      e.hp -= autoPilot ? e.maxHp * 5 : o.dmg;
      e.hitFlash = 0.22;
      spawnExplosion(e.x,e.y,1.0);
      orbs.splice(i,1);

      if(e.hp<=0){
        // Explosion/parry ölümü: aynı ceset parçaları ama çok daha güçlü fırlatılır.
        if(registerKill(e, true)){
          enemies.splice(j,1);
        }
      }
      break;
    }
  }
}

}

// ----- enemy AI -----
for(const e of enemies){
if(e.hitFlash > 0) e.hitFlash -= dt;
if(e.type === 'green') updateGreen(e, dt);
else updateGlob(e, dt);
}

// ----- spawn -----
// Ana menüde arka planda gösteri yapıldığı için en baştan çok kalabalık
// ve çok hızlı spawn olur. Gerçek oyunda ise kill sayısı arttıkça
// kademeli olarak kalabalıklaşır: 100 kill'de daha fazla düşman,
// 200 kill'de bunun 2 katı daha fazla, 300 kill'den sonra ise tıpkı
// ana menüdeki kadar yoğun (aynı cap + aynı spawn hızı).
spawnTimer -= dt;

let spawnCap, spawnInterval;
if(autoPilot){
spawnCap = 100 + waveDifficulty;
spawnInterval = Math.max(0.08, 0.35 - waveDifficulty0.01);
} else {
const kills = player.totalKills;
if(kills >= 300){
// Ana menüdekiyle birebir aynı yoğunluk.
spawnCap = 100 + waveDifficulty;
spawnInterval = Math.max(0.08, 0.35 - waveDifficulty0.01);
} else if(kills >= 200){
spawnCap = 50 + waveDifficulty;      // 200'den sonra: ilk artışın 2 katı
spawnInterval = Math.max(0.25, 1.2 - waveDifficulty0.05);
} else if(kills >= 100){
spawnCap = 30 + waveDifficulty;      // 100'den sonra: daha fazla düşman
spawnInterval = Math.max(0.4, 1.6 - waveDifficulty0.06);
} else {
spawnCap = 10 + waveDifficulty;      // başlangıç yoğunluğu
spawnInterval = Math.max(0.6, 2.2 - waveDifficulty*0.08);
}
}

if(spawnTimer <= 0 && enemies.length < spawnCap){
spawnEnemy();
spawnTimer = spawnInterval;
waveDifficulty += 0.05;
}

if(banner.timer>0) banner.timer -= dt;
}

function updateGreen(e, dt){
// ----- boss awakening: grow in place, don't act until fully grown -----
if(e.mutating){
e.growTimer -= dt;
const t = clamp(1 - Math.max(0,e.growTimer)/e.growDuration, 0, 1);
// eased growth with a fading wobble/pulse on top, like it's shuddering awake
const eased = 1 - Math.pow(1-t, 2);
const wobble = Math.sin(tMath.PI7) * (1-t) * 0.12;
e.radius = e.baseRadius + (e.targetRadius - e.baseRadius) * eased + e.baseRadius*wobble;
if(e.growTimer <= 0){
e.mutating = false;
e.radius = e.targetRadius;
}
return; // stays put while it mutates
}

if(e.isBoss){
if(e.orbBurstTimer === undefined) e.orbBurstTimer = e.orbBurstRate || 2.6;
e.orbBurstTimer -= dt;
if(e.orbBurstTimer <= 0){
bossOrbBurst(e);
e.orbBurstTimer = e.orbBurstRate || 2.6;
}
}

const d = dist(e.x,e.y,player.x,player.y);
if(e.hitCooldown>0) e.hitCooldown -= dt;

if(e.state === 'chase'){
if(d > 4){
const ang = Math.atan2(player.y-e.y, player.x-e.x);
e.x += Math.cos(ang)e.speeddt;
e.y += Math.sin(ang)e.speeddt;
}
if(d < 95){
e.state = 'telegraph';
e.stateTimer = 0.42;
}
// contact damage (small chip damage while lingering close)
if(d < e.radius + player.radius && player.invuln<=0 && e.hitCooldown<=0){
damagePlayer(8);
e.hitCooldown = 0.6;
}
} else if(e.state === 'telegraph'){
e.stateTimer -= dt;
if(e.stateTimer <= 0){
e.state = 'lunge';
e.stateTimer = 0.22;
e.lungeFrom = {x.x,y.y};
e.lungeTo = {x.x,y.y};
}
} else if(e.state === 'lunge'){
e.stateTimer -= dt;
const t = 1 - Math.max(0,e.stateTimer)/0.22;
e.x = e.lungeFrom.x + (e.lungeTo.x - e.lungeFrom.x)*t;
e.y = e.lungeFrom.y + (e.lungeTo.y - e.lungeFrom.y)*t;
if(dist(e.x,e.y,player.x,player.y) < e.radius + player.radius && player.invuln<=0 && e.hitCooldown<=0){
damagePlayer(e.dmg);
e.hitCooldown = 1.0;
}
if(e.stateTimer <= 0){
e.state = 'chase';
e.stateTimer = 0;
}
}
}

function updateGlob(e, dt){
const d = dist(e.x,e.y,player.x,player.y);
const ang = Math.atan2(player.y-e.y, player.x-e.x);
if(d < e.preferredMin){
e.x -= Math.cos(ang)e.speeddt;
e.y -= Math.sin(ang)e.speeddt;
} else if(d > e.preferredMax){
e.x += Math.cos(ang)e.speeddt;
e.y += Math.sin(ang)e.speeddt;
} else {
// hafif yanal (strafe) hareket
e.x += Math.cos(ang+Math.PI/2)e.speed0.35dt;
e.y += Math.sin(ang+Math.PI/2)e.speed0.35dt;
}
e.x = clamp(e.x, e.radius, WORLD.w-e.radius);
e.y = clamp(e.y, e.radius, WORLD.h-e.radius);

e.fireTimer -= dt;
if(e.fireTimer <= 0){
// Larger cooldown so the much faster orbs are still fair.
e.fireTimer = 2.2 + Math.random()*0.9;
const a2 = Math.atan2(player.y-e.y, player.x-e.x);
orbs.push({
x.x, y.y,
vx: Math.cos(a2)*980, vy: Math.sin(a2)*980,
dmg: 14,
});
}
}

function spawnExplosion(x,y,scale=1){
explosions.push({x,y,timer:0.34,maxTimer:0.34,scale});
if(!autoPilot) playSFX(SFX.explosion, 0.55);
}

function spawnDeathPieces(){
const bodyImg = playerPortrait();
const size = player.radius*2 + 20;
deathPieces = [];

for(let py=0;py<2;py++){
for(let px=0;px<2;px++){
const a = Math.random()Math.PI2;
const speed = 170 + Math.random()*260;
deathPieces.push({
x.x+(px?7:-7),
y.y+(py?7:-7),
vx.cos(a)speed,
vy.sin(a)speed-90,
rot.random()Math.PI2,
vr:(Math.random()-0.5)12,
size0.58,
alpha:1,
sx0.5,
sy0.5,
img,
life:1.05
});
}
}
spawnExplosion(player.x,player.y,1.35);
}

function damageEnemiesInExplosion(x,y,radius,damage){
for(let j=enemies.length-1;j>=0;j--){
const e=enemies[j];
if(e.mutating) continue; // mutasyon animasyonu bitmeden boss hasar alamaz
const d=dist(x,y,e.x,e.y);
if(d>radius+e.radius) continue;
const scale=Math.max(0.35,1-d/(radius+e.radius));
e.hp -= damage*scale;
e.hitFlash=0.28;
if(e.hp<=0){
if(registerKill(e, true)){
enemies.splice(j,1);
}
}
}
}

function spawnCorpsePieces(e, exploded=false){
const img = e.type === 'glob' ? IMG.glob : IMG.green;
const fullSize = e.radius*2 + 14;
const cols = 3, rows = 3;
const pieceW = fullSize / cols;
const pieceH = fullSize / rows;

for(let py=0; py<rows; py++){
for(let px=0; px<cols; px++){
const a = Math.random()Math.PI2;
// Normal ölüm kontrollü; explosion/parry çok daha sert ve uzağa fırlatır.
const speed = exploded
? 620 + Math.random()*980
: 95 + Math.random()*170;

  corpsePieces.push({
    x:e.x + (px-1)*pieceW*0.20,
    y:e.y + (py-1)*pieceH*0.20,
    vx:Math.cos(a)*speed,
    vy:Math.sin(a)*speed,
    rot:(Math.random()-0.5)*0.8,
    vr:(Math.random()-0.5)*(exploded ? 26 : 9),
    fullSize,
    pieceW,
    pieceH,
    px, py,
    cols, rows,
    img,
    alpha:1,
    life:10,
    settled:false,
    exploded
  });
}

}
}

function damagePlayer(amount){
if(player.invuln > 0 || !player.alive) return;
if(autoPilot){
// Ana menüdeki bot ölümsüz - hiç hasar almaz, streak hiç kırılmaz.
player.invuln = 0.15;
return;
}
player.hp -= amount;
player.killStreak = 0; // getting hit resets the streak -> body reverts to nice.png (and dash pitch resets to normal)
player.invuln = 0.5;
if(player.hp <= 0){
player.hp = 0;
player.alive = false;
spawnDeathPieces();
showDeathScreen();
}
}

// Heals the player (used for point-blank "execution" kills) and kicks off
// a green pulse ring around them so the heal is readable at a glance.
function healPlayer(amount){
if(!player.alive) return;
player.hp = Math.min(player.maxHp, player.hp + amount);
healPulseTimer = 0.4;
if(!autoPilot) playSFX(SFX.heal, 0.6);
}

function showBanner(){
const msgs = ['STREAK!','NICE!','KEEP GOING!','ON FIRE!','UNSTOPPABLE!'];
if(player.killStreak >= 7) banner.text = 'BRUTAL!';
else if(player.killStreak >= 3) banner.text = msgs[Math.min(msgs.length-1, player.killStreak-1)];
else banner.text = 'KILL';
banner.timer = 0.6;
}

// ---------- RENDER ----------
function render(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// --- screen shake (boss awakening / orb bursts) ---
let shakeX = 0, shakeY = 0;
if(screenShake.timer > 0){
const p = screenShake.timer / screenShake.duration; // 1 -> 0
const mag = screenShake.strength * p;
shakeX = (Math.random()*2-1) * mag;
shakeY = (Math.random()*2-1) * mag;
}
ctx.save();
ctx.translate(shakeX, shakeY);

// --- map (offset by camera) ---
if(IMG.map.loaded){
// stretched to exactly cover the world bounds, offset by camera
// Integer camera coordinates + smoothing off keeps Map.png crisp while stretched.
const mapX = -Math.round(camera.x);
const mapY = -Math.round(camera.y);
ctx.drawImage(IMG.map, mapX, mapY, Math.round(WORLD.w), Math.round(WORLD.h));
} else {
ctx.fillStyle = '#25321f';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle = 'rgba(255,255,255,.08)';
const grid = 100;
for(let gx = -((camera.x)%grid); gx<canvas.width; gx+=grid){
ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,canvas.height); ctx.stroke();
}
for(let gy = -((camera.y)%grid); gy<canvas.height; gy+=grid){
ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke();
}
ctx.fillStyle='rgba(255,255,255,.35)';
ctx.font='bold 13px Arial';
ctx.fillText('images/Map.png not found - showing placeholder ground', 16, canvas.height-16);
}

// --- corpses are always on the back layer ---
for(const piece of corpsePieces) drawCorpsePiece(piece);

// --- sort world objects by y for simple depth ordering ---
const drawables = [];
for(const e of enemies) drawables.push({y.y, draw:()=>drawEnemy(e)});
drawables.push({y.y, draw:()=>drawPlayer()});
drawables.sort((a,b)=>a.y-b.y);
for(const d of drawables) d.draw();

// --- explosion.png effects ---
for(const ex of explosions){
const p = 1 - ex.timer/ex.maxTimer;
const sx = ex.x-camera.x, sy = ex.y-camera.y;

if(IMG.explosion.loaded){
  ctx.save();
  ctx.globalAlpha = Math.max(0,1-p);
  const s = (55+p*115)*ex.scale;
  ctx.drawImage(IMG.explosion,sx-s/2,sy-s/2,s,s);
  ctx.restore();
} else {
  ctx.save();
  ctx.globalAlpha = Math.max(0,1-p);
  ctx.strokeStyle = '#ffcc33';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(sx,sy,(20+p*65)*ex.scale,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

}

// --- Düşman ceset parçaları arka katmanda drawCorpsePiece ile çizilir ---

// --- PNG parçaları: ölümde dışarı saçılır ve düşer ---
for(const piece of deathPieces){
const sx = piece.x-camera.x, sy = piece.y-camera.y;
ctx.save();
ctx.globalAlpha = piece.alpha;
ctx.translate(sx,sy);
ctx.rotate(piece.rot);

if(piece.img && piece.img.loaded){
  ctx.beginPath();
  ctx.rect(-piece.size/2,-piece.size/2,piece.size/2,piece.size/2);
  ctx.clip();
  ctx.drawImage(
    piece.img,
    -piece.size/2-piece.sx*piece.size,
    -piece.size/2-piece.sy*piece.size,
    piece.size*2,
    piece.size*2
  );
} else {
  ctx.fillStyle = '#cc3333';
  ctx.fillRect(-piece.size/4,-piece.size/4,piece.size/2,piece.size/2);
}
ctx.restore();

}

// bullets / orbs (drawn on top)
for(const b of bullets){
const sx = b.x - camera.x, sy = b.y - camera.y;
const ang = Math.atan2(b.vy,b.vx);
if(b.explosive){ ctx.save(); ctx.shadowColor='#ff9a22'; ctx.shadowBlur=18; drawRotatedImage(IMG.bullet, sx, sy, 32, 16, ang, '#ffcc00', ''); ctx.restore(); } else { drawRotatedImage(IMG.bullet, sx, sy, 26, 12, ang, '#ffcc00', ''); }
}
for(const o of orbs){
const sx = o.x - camera.x, sy = o.y - camera.y;
const ang = Math.atan2(o.vy, o.vx);
if(IMG.orb.loaded){
ctx.save();
ctx.shadowColor = '#ffee66';
ctx.shadowBlur = 16;
ctx.translate(sx, sy);
ctx.rotate(ang);
ctx.drawImage(IMG.orb, -(o.parried?32:22), -(o.parried?32:22), o.parried?64:44, o.parried?64:44);
ctx.restore();
} else {
// fallback glow circle if images/yellow-orb.png wasn't found
ctx.save();
ctx.beginPath();
ctx.fillStyle = '#ffdd22';
ctx.shadowColor = '#ffee66';
ctx.shadowBlur = 18;
ctx.arc(sx, sy, 16, 0, Math.PI*2);
ctx.fill();
ctx.restore();
}
}

// Parry pulse artık HUD ekranının ortasında değil, parrylenen orbun
// bulunduğu dünya pozisyonundan çıkar.
if(parryPulseTimer > 0 && parryPulse.active){
const p = 1 - parryPulseTimer / 0.38;
const px = parryPulse.x - camera.x;
const py = parryPulse.y - camera.y;
const r = 18 + p * 105;
ctx.save();
ctx.globalAlpha = (1-p) * 0.9;
ctx.strokeStyle = '#fff06a';
ctx.lineWidth = 7 - p4;
ctx.shadowColor = '#ffd52e';
ctx.shadowBlur = 22;
ctx.beginPath();
ctx.arc(px, py, r, 0, Math.PI2);
ctx.stroke();
ctx.globalAlpha = (1-p) * 0.28;
ctx.fillStyle = '#fff7a0';
ctx.beginPath();
ctx.arc(px, py, r0.62, 0, Math.PI2);
ctx.fill();
ctx.restore();
} else {
parryPulse.active = false;
}

// --- boss "awakening" pulse (big red ring where the mutation is happening) ---
if(bossPulse.active && bossPulse.timer > 0){
const p = 1 - bossPulse.timer / bossPulse.duration;
const bx = bossPulse.x - camera.x;
const by = bossPulse.y - camera.y;
const ringCount = 3;
for(let i=0;i<ringCount;i++){
const ringP = clamp(p1.3 - i0.18, 0, 1);
if(ringP<=0 || ringP>=1) continue;
const r = 20 + ringP * 260;
ctx.save();
ctx.globalAlpha = (1-ringP) * 0.55;
ctx.strokeStyle = '#ff2222';
ctx.lineWidth = 9 - ringP5;
ctx.shadowColor = '#ff0000';
ctx.shadowBlur = 28;
ctx.beginPath();
ctx.arc(bx, by, r, 0, Math.PI2);
ctx.stroke();
ctx.restore();
}
ctx.save();
ctx.globalAlpha = 0.18 + 0.12Math.sin(performance.now()/60);
ctx.fillStyle = '#ff3333';
ctx.beginPath();
ctx.arc(bx, by, 34, 0, Math.PI2);
ctx.fill();
ctx.restore();
}

// --- heal pulse (green ring on the player from a point-blank kill) ---
if(healPulseTimer > 0){
const p = 1 - healPulseTimer / 0.4;
const psx = player.x - camera.x, psy = player.y - camera.y;
const r = 14 + p * 70;
ctx.save();
ctx.globalAlpha = (1-p) * 0.9;
ctx.strokeStyle = '#39ff6e';
ctx.lineWidth = 6 - p3;
ctx.shadowColor = '#26ff5e';
ctx.shadowBlur = 20;
ctx.beginPath();
ctx.arc(psx, psy, r, 0, Math.PI2);
ctx.stroke();
ctx.globalAlpha = (1-p) * 0.25;
ctx.fillStyle = '#8dffaa';
ctx.beginPath();
ctx.arc(psx, psy, r0.55, 0, Math.PI2);
ctx.fill();
ctx.restore();
}

ctx.restore(); // end screen-shake transform

updateUI();
}

function drawCorpsePiece(piece){
const sx = piece.x-camera.x, sy = piece.y-camera.y;
if(sx<-100 || sy<-100 || sx>canvas.width+100 || sy>canvas.height+100) return;

ctx.save();
ctx.globalAlpha = piece.alpha;
ctx.translate(sx,sy);
ctx.rotate(piece.rot);

if(piece.img && piece.img.loaded){
const srcW = piece.img.naturalWidth / piece.cols;
const srcH = piece.img.naturalHeight / piece.rows;
ctx.drawImage(
piece.img,
piece.pxsrcW, piece.pysrcH, srcW, srcH,
-piece.pieceW/2, -piece.pieceH/2, piece.pieceW, piece.pieceH
);
} else {
ctx.fillStyle = piece.img===IMG.glob ? '#d7b91c' : '#35c84b';
ctx.fillRect(-piece.pieceW/2,-piece.pieceH/2,piece.pieceW,piece.pieceH);
}
ctx.restore();
}

function drawPlayer(){
const sx = player.x - camera.x, sy = player.y - camera.y;
const mw = mouseWorld();
const aimAngle = Math.atan2(mw.y - player.y, mw.x - player.x);
const facingLeft = Math.cos(aimAngle) < 0;

ctx.save();
if(player.invuln > 0 && Math.floor(player.invuln*30)%2===0){
ctx.globalAlpha = 0.45;
}

// Body IS the mood sprite (nice.png / mid.png / angry.png), no separate
// portrait UI - it swaps directly based on kill streak, and flips to
// face the aim direction.
const bodyImg = playerPortrait();
const size = player.radius*2 + 20;
ctx.translate(sx, sy);
if(facingLeft) ctx.scale(-1, 1);
if(bodyImg.loaded){
ctx.drawImage(bodyImg, -size/2, -size/2, size, size);
} else {
const label = player.killStreak>=7 ? 'ANGRY' : player.killStreak>=3 ? 'MID' : 'NICE';
const color = player.killStreak>=7 ? '#cc2222' : player.killStreak>=3 ? '#cc8822' : '#33aa55';
drawPlaceholder(0, 0, size, size, color, label, 0);
}
ctx.restore();

// gun.png points WEST (left) at 0 radians. Rotate it directly with aim.
// The muzzle position and bullet direction use the SAME aimAngle.
const gunDist = player.radius + 10;
const gx = sx + Math.cos(aimAngle) * gunDist;
const gy = sy + Math.sin(aimAngle) * gunDist;
const gunAngle = aimAngle + GUN_ART_OFFSET;
const weaponImg = weapon==='shotgun' ? IMG.shotgun : IMG.gun;
drawRotatedImage(weaponImg, gx, gy, weapon==='shotgun'?58:46, weapon==='shotgun'?58:46, gunAngle, '#888888', weapon==='shotgun'?'SHOTGUN':'GUN');
}

function drawEnemy(e){
const sx = e.x - camera.x, sy = e.y - camera.y;
if(sx < -80 || sy < -80 || sx > canvas.width+80 || sy > canvas.height+80) return;

const img = e.type === 'green' ? IMG.green : IMG.glob;
const size = e.radius2 + 14;
let flash = 0;
if(e.type==='green' && e.state==='telegraph'){
flash = 0.5 + 0.5Math.sin(performance.now()/40);
}

ctx.save();
if(flash>0){
ctx.shadowColor = '#ff2222';
ctx.shadowBlur = 18*flash;
}
if(img.loaded){
ctx.drawImage(img, sx-size/2, sy-size/2, size, size);
} else {
drawPlaceholder(sx, sy, size, size, e.type==='green' ? '#2ecc40':'#e6c419', e.type.toUpperCase(), 0);
}
// Health bar yerine hasar alınca kısa kırmızı flash.
if(e.hitFlash > 0){
ctx.globalCompositeOperation='source-atop';
ctx.globalAlpha=Math.min(0.78,e.hitFlash/0.16);
ctx.fillStyle='#ff2222';
ctx.fillRect(sx-size/2,sy-size/2,size,size);
ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
}
ctx.restore();

}

function updateUI(){
document.getElementById('hpBar').style.width = (100player.hp/player.maxHp)+'%';
document.getElementById('hpText').textContent = Math.max(0,Math.round(player.hp))+' / '+player.maxHp;
const dashPct = player.dashCooldown<=0 ? 100 : 100(1 - player.dashCooldown/player.dashCooldownMax);
document.getElementById('dashBar').style.width = dashPct+'%';
document.getElementById('streakText').textContent = Streak: ${player.killStreak}  •  Kills: ${player.totalKills};

const bossWrapEl = document.getElementById('bossBarWrap');
if(bossActive && bossEnemyRef){
bossWrapEl.classList.add('show');
document.getElementById('bossName').textContent = bossEnemyRef.bossName || 'MUTATED GREEN';
document.getElementById('bossBar').style.width = Math.max(0, 100*bossEnemyRef.hp/bossEnemyRef.maxHp)+'%';
} else {
bossWrapEl.classList.remove('show');
}

const bannerEl = document.getElementById('banner');
if(banner.timer>0){
bannerEl.textContent = banner.text;
bannerEl.style.opacity = Math.min(1, banner.timer*2.2);
bannerEl.style.transform = translate(-50%,-50%) scale(${1+ (0.6-banner.timer)*0.4});
} else {
bannerEl.style.opacity = 0;
}

}

function showDeathScreen(){
document.getElementById('finalStats').textContent =
Total kills: ${player.totalKills}  •  Best streak: ${player.killStreak};
document.getElementById('deathScreen').style.display = 'flex';
}

function restartGame(){
player.x = WORLD.w/2; player.y = WORLD.h/2;
player.hp = player.maxHp;
player.alive = true;
player.vx = 0; player.vy = 0;
player.killStreak = 0; player.totalKills = 0;
player.dashCooldown = 0; player.dashing = false; player.invuln = 0;
enemies = []; bullets = []; orbs = []; explosions = []; deathPieces = []; corpsePieces = [];
lastParriedOrbPos = null; parryPulse.active = false;
parryCooldown = 0; parryPulseTimer = 0;
spawnTimer = 1.0; waveDifficulty = 1;
nextBossThreshold = 50; bossEnemyRef = null; bossActive = false;
screenShake = { timer:0, duration:1, strength:0 };
bossPulse = { active, timer:0, duration:1, x:0, y:0 };
healPulseTimer = 0;
botAimAngle = 0; botFireTimer = 0.4; botDashTimer = 1.6; botWeaponTimer = 5; botStrafeDir = 1; botStrafeTimer = 2;
botMoveX = 0; botMoveY = 0;
document.getElementById('deathScreen').style.display = 'none';
lastTime = performance.now();
}

// ---------- MUSIC ----------
// musics/elevator.mp3 loops in the background while the main menu is up,
// musics/game.mp3 takes over (looping) as soon as the STAGE 1 intro shows,
// and keeps playing (pausable via ESC) through the real run.
const musicElevator = new Audio('musics/elevator.mp3');
musicElevator.loop = true;
musicElevator.volume = 0.55;

const musicGame = new Audio('musics/game.mp3');
musicGame.loop = true;
musicGame.volume = 0.55;

// Once true, elevator.mp3 must never play again (menu-only track).
let gameStarted = false;

// Browsers block audio.play() until the user has interacted with the page.
// Try immediately; if that's blocked, retry on the first click/keypress.
// guard (optional) is re-checked right before the retry actually plays,
// so a track can be cancelled even if its "unlock" listener fires late.
function tryPlayMusic(audio, guard){
const p = audio.play();
if(p && p.catch){
p.catch(() => {
const resume = () => {
if(guard && !guard()) return;
audio.play().catch(()=>{});
};
window.addEventListener('pointerdown', resume, {once});
window.addEventListener('keydown', resume, {once});
});
}
}

tryPlayMusic(musicElevator, () => !gameStarted); // starts as soon as the page loads (menu music)

// ---------- MAIN MENU -> STAGES -> REAL GAME WIRING ----------
// 1) Main menu: bot plays behind the PLAY button, elevator music.
// 2) Hitting PLAY fades the menu out and brings up the STAGE 1 / MATRIX
//    intro screen - the bot KEEPS playing behind it, and game.mp3 kicks in.
// 3) Hitting ENTER on that screen fades it out and hands control to the
//    player for real (HUD appears, fresh stats).
document.getElementById('ui').style.display = 'none';

// Flip the flag (and kill elevator) on pointerdown, which fires on the
// PLAY button itself BEFORE it bubbles up to window - this beats the
// fallback "resume" listener above to the punch, so there's no race
// where elevator sneaks back in for the same click that starts the game.
document.getElementById('playBtn').addEventListener('pointerdown', () => {
gameStarted = true;
musicElevator.pause();
musicElevator.currentTime = 0;
});

document.getElementById('playBtn').addEventListener('click', () => {
gameStarted = true;
const menuEl = document.getElementById('mainMenu');
menuEl.classList.add('fade-out');

musicElevator.pause();
musicElevator.currentTime = 0;

setTimeout(() => {
menuEl.classList.add('hidden');

// bot keeps driving the player in the background; STAGE 1 intro shows
inStages = true;
const stagesEl = document.getElementById('stagesScreen');
stagesEl.classList.remove('hidden');
// force reflow so the opacity transition actually plays
void stagesEl.offsetWidth;
stagesEl.classList.add('show');

document.getElementById('stageSubtitle').innerHTML = STAGE_LINES.join('<br>');

tryPlayMusic(musicGame, () => gameStarted);

}, 620);
});

document.getElementById('enterBtn').addEventListener('click', () => {
const stagesEl = document.getElementById('stagesScreen');
stagesEl.classList.remove('show');

setTimeout(() => {
stagesEl.classList.add('hidden');
inStages = false;
inMenu = false;
autoPilot = false;
playingReal = true;
document.getElementById('ui').style.display = '';
restartGame();
}, 550);
});

// ---------- GAME LOOP ----------
function loop(now){
const dt = Math.min(0.033, (now - lastTime)/1000);
lastTime = now;
if(!paused) update(dt);
render();
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
