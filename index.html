<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KILLTHEM</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Trebuchet MS',Arial,sans-serif;user-select:none;-webkit-user-select:none;-moz-user-select:none;} canvas{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #game{display:block;cursor:crosshair;}
  #ui{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;color:#fff;text-shadow:2px 2px 3px #000;
  }
  #hpWrap{position:absolute;top:16px;left:16px;width:260px;}
  #hpBarBg{width:100%;height:22px;background:#331111;border:3px solid #000;border-radius:4px;overflow:hidden;}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ff2222,#ff6644);transition:width .12s;}
  #hpText{font-weight:bold;font-size:14px;margin-top:2px;}
  #dashWrap{position:absolute;top:70px;left:16px;width:180px;}
  #dashBarBg{width:100%;height:12px;background:#112233;border:2px solid #000;border-radius:3px;overflow:hidden;}
  #dashBar{height:100%;width:100%;background:linear-gradient(90deg,#22ccff,#66ffff);}
  #streakText{position:absolute;top:16px;left:16px;margin-top:96px;font-size:14px;opacity:.85;}
  #center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  #deathScreen{
    position:fixed;inset:0;background:rgba(10,0,0,.85);display:none;
    align-items:center;justify-content:center;flex-direction:column;color:#fff;
    pointer-events:auto;z-index:50;
  }
  #deathScreen h1{font-size:64px;color:#ff3333;margin:0 0 10px;letter-spacing:4px;text-shadow:0 0 20px #ff0000;}
  #deathScreen p{font-size:20px;margin:6px;}
  #deathScreen button{
    margin-top:20px;padding:14px 34px;font-size:18px;background:#ff2222;color:#fff;
    border:none;border-radius:6px;cursor:pointer;font-weight:bold;letter-spacing:1px;
  }
  #deathScreen button:hover{background:#ff5555;}
  #banner{
    position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:46px;font-weight:bold;color:#ffdd33;text-shadow:0 0 18px #ff8800,3px 3px 0 #000;
    opacity:0;pointer-events:none;letter-spacing:2px;
  }
  #parryPulse{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,210,.95) 0%,rgba(255,230,70,.65) 16%,rgba(255,120,0,.28) 38%,rgba(0,0,0,0) 72%);}
  #calibText{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:15px;font-weight:bold;color:#22ffee;background:rgba(0,0,0,.55);
    padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .15s;
  }
  #bossBarWrap{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    width:56%;max-width:760px;min-width:320px;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #bossBarWrap.show{ opacity:1; }
  #bossName{
    text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;
    color:#ff2b2b;text-shadow:0 0 10px #ff0000,0 0 24px #ff2200,2px 2px 0 #000;
    margin-bottom:6px;
  }
  #bossBarBg{
    width:100%;height:30px;background:#200404;border:3px solid #000;
    border-radius:6px;overflow:hidden;box-shadow:0 0 22px rgba(255,0,0,.55),inset 0 0 10px #000;
  }
  #bossBar{
    height:100%;width:100%;
    background:linear-gradient(90deg,#8a0000,#ff1414 55%,#ff5a3d);
    transition:width .15s;
  }

  /* ---------- shared big menu-button style ---------- */
  .bigBtn{
    pointer-events:auto;
    background:transparent;
    color:#fff;
    border:3px solid #fff;
    font-family:'Trebuchet MS',Arial,sans-serif;
    font-size:26px;
    font-weight:bold;
    letter-spacing:6px;
    padding:16px 50px;
    cursor:pointer;
    text-shadow:0 0 10px rgba(255,255,255,.6);
    box-shadow:0 0 0 rgba(255,255,255,0);
    transition:background .2s, box-shadow .2s, transform .15s;
  }
  .bigBtn:hover{
    background:rgba(255,255,255,.08);
    box-shadow:0 0 22px rgba(255,255,255,.35);
  }
  .bigBtn:active{ transform:scale(0.96); }
  .bigBtn.danger{ border-color:#ff4444; color:#ff8888; text-shadow:0 0 10px rgba(255,68,68,.6); }
  .bigBtn.danger:hover{ background:rgba(255,68,68,.12); box-shadow:0 0 22px rgba(255,68,68,.45); }

  #mainMenu{
    position:fixed;inset:0;z-index:60;
    pointer-events:none;
    opacity:1;transition:opacity .6s ease;
  }
  #mainMenu.fade-out{ opacity:0; }
  #mainMenu.hidden{ display:none; }
  #menuStack{
    position:absolute; bottom:34px; left:34px;
    display:flex; flex-direction:column; align-items:flex-start; gap:18px;
  }
  #playBtn{ font-size:23px; padding:15px 42px; letter-spacing:6px; }
  #settingsBtn{font-size:17px;padding:11px 32px;letter-spacing:4px;}
  #settingsScreen{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);pointer-events:auto;}
  #settingsScreen.show{display:flex;}
  #settingsPanel{min-width:340px;padding:28px;border:2px solid #fff;background:rgba(10,10,10,.94);box-shadow:0 0 30px rgba(255,255,255,.18);}
  .settingRow{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:18px 0;font-weight:bold;letter-spacing:2px;}
  .settingRow input{width:180px;}
  #stageSelect{
    position:fixed;inset:0;z-index:65;display:none;
    flex-direction:column;align-items:flex-start;justify-content:flex-start;
    background:rgba(0,0,0,.88);pointer-events:auto;
    padding:48px 56px;overflow:auto;box-sizing:border-box;
  }
  #stageSelect.show{display:flex;}
  #stageSelect h1{color:#fff;letter-spacing:8px;margin:0 0 28px;font-size:28px;}
  #stageGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, 300px);
    gap:26px;
    width:100%;
  }
  .stageCard{
    position:relative;width:300px;overflow:hidden;
    border:2px solid #39ff6e;background:rgba(0,20,8,.7);color:#fff;
    cursor:pointer;font-weight:bold;letter-spacing:2px;
    transition:box-shadow .2s, transform .15s;
  }
  .stageCard:hover{box-shadow:0 0 25px #39ff6e;transform:translateY(-3px);}
  .stageThumb{display:block;width:100%;height:160px;background:#0d1509;}
  .stageCardTitle{padding:14px 12px;text-align:center;font-size:16px;}
  .lockOverlay{
    display:none;position:absolute;inset:0;
    background:rgba(0,0,0,.75);align-items:center;justify-content:center;
    flex-direction:column;gap:6px;text-align:center;color:#ff5c5c;
    font-size:13px;letter-spacing:2px;padding:20px;box-sizing:border-box;
  }
  .lockOverlay .lockIcon{font-size:26px;}
  .stageCard.locked{cursor:not-allowed;pointer-events:none;filter:grayscale(.9) brightness(.55);}
  .stageCard.locked .lockOverlay{display:flex;}
  .stageCard.locked:hover{box-shadow:none;transform:none;}

  #diffCorner{
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    pointer-events:auto;
  }
  #diffToggleBtn{
    background:rgba(0,0,0,.35);
    font-family:'Trebuchet MS',Arial,sans-serif;
    font-size:14px; font-weight:bold; letter-spacing:2px;
    padding:10px 18px; cursor:pointer; border-radius:4px;
    border:2px solid rgba(255,255,255,.6); color:#fff;
    transition:background .15s, box-shadow .15s;
  }
  #diffToggleBtn:hover{ background:rgba(255,255,255,.12); box-shadow:0 0 14px rgba(255,255,255,.3); }
  #diffOptions{
    display:none; flex-direction:column; gap:8px;
    background:rgba(0,0,0,.55); padding:10px; border-radius:6px;
  }
  #diffOptions.show{ display:flex; }
  .diffBtn{
    background:transparent;
    font-family:'Trebuchet MS',Arial,sans-serif;
    font-size:14px; font-weight:bold; letter-spacing:2px;
    padding:9px 22px; cursor:pointer; border-radius:3px;
    border:2px solid rgba(255,255,255,.5); color:rgba(255,255,255,.75);
    text-align:left;
    transition:background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .diffBtn:hover{ border-color:#fff; color:#fff; }
  .diffBtn[data-diff="easy"].active{ border-color:#39ff6e; color:#39ff6e; background:rgba(57,255,110,.12); box-shadow:0 0 14px rgba(57,255,110,.5); }
  .diffBtn[data-diff="normal"].active{ border-color:#ffdd33; color:#ffdd33; background:rgba(255,221,51,.12); box-shadow:0 0 14px rgba(255,221,51,.5); }
  .diffBtn[data-diff="brutal"].active{ border-color:#ff3333; color:#ff5555; background:rgba(255,51,51,.14); box-shadow:0 0 14px rgba(255,51,51,.55); }

  /* ---------- stage complete overlay ---------- */
  #stageCompleteScreen{
    position:fixed;inset:0;z-index:75;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(0,10,4,.9);color:#fff;
    pointer-events:none;
    opacity:0;transition:opacity .5s ease;
  }
  #stageCompleteScreen.show{ display:flex; opacity:1; }
  #stageCompleteScreen h1{
    font-size:52px;color:#39ff6e;margin:0 0 14px;letter-spacing:5px;
    text-shadow:0 0 24px #22ff66,0 0 60px #0aff44,3px 3px 0 #000;
    text-align:center;

  #stageCompleteScreen p{ font-size:18px;margin:4px;opacity:.85; }

  .completedBadge{
    position:absolute;top:8px;right:8px;z-index:2;
    background:rgba(57,255,110,.16);border:1px solid #39ff6e;color:#39ff6e;
    font-size:11px;font-weight:bold;letter-spacing:1px;
    padding:4px 9px;border-radius:4px;display:none;
  }
  .completedBadge.show{ display:block; }
  .bossReplayBadge{position:absolute;right:9px;bottom:42px;z-index:3;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.65);color:#fff;font-size:10px;font-weight:900;letter-spacing:1.5px;padding:5px 8px;border-radius:4px;display:none;text-shadow:0 1px 3px #000;}
  .bossReplayBadge.show{display:block;}

  /* ---------- pause / leave-confirm screen ---------- */
  #pauseScreen{
    position:fixed;inset:0;z-index:70;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(0,0,0,.72);
    pointer-events:auto;
  }
  #pauseScreen.show{ display:flex; }
  #pauseTitle{
    color:#fff;font-size:38px;font-weight:900;letter-spacing:5px;margin-bottom:36px;
    text-shadow:0 0 16px rgba(255,255,255,.5);text-align:center;
  }
  #pauseBtnRow{ display:flex; gap:24px; }

/* Settings readability */
#settingsScreen, #settingsScreen *{color:#fff;}
#settingsScreen label{color:#fff !important;}
#settingsScreen input[type="range"]{accent-color:#fff;}

/* ---------- wake-up-from-black overlay (plays when ENTER is pressed) ---------- */
#wakeOverlay{
  position:fixed;inset:0;z-index:90;
  background:#000;
  opacity:0;
  pointer-events:none;
}
#cubeDialogue{
  position:fixed;left:50%;bottom:42px;transform:translateX(-50%);
  width:min(900px,88vw);z-index:95;display:none;
  text-align:center;color:#fff;pointer-events:none;
  text-shadow:0 3px 5px #000,0 0 12px #000;
}
#cubeDialogue.show{display:block;}
#cubeSpeaker{font-size:18px;font-weight:900;letter-spacing:3px;margin-bottom:8px;}
#cubeSubtitle{font-size:26px;font-weight:700;line-height:1.35;min-height:36px;}
#cubeDialogue.silence #cubeSubtitle{opacity:0;}

  #bossStagesBtn{position:fixed;right:22px;bottom:22px;z-index:68;font-size:15px;padding:12px 18px;letter-spacing:3px;pointer-events:auto;}
  #bossStageSelect{position:fixed;inset:0;z-index:76;display:none;flex-direction:column;align-items:flex-start;background:rgba(0,0,0,.92);pointer-events:auto;padding:48px 56px;box-sizing:border-box;}
  #bossStageSelect.show{display:flex;} #bossStageSelect h1{letter-spacing:8px;margin:0 0 28px;font-size:28px;}
  #multiBossBars{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:56%;max-width:760px;min-width:320px;display:none;flex-direction:column;gap:7px;}
  #multiBossBars.show{display:flex}.miniBossRow .miniBossName{text-align:center;font-size:14px;font-weight:900;letter-spacing:3px;text-shadow:0 0 8px #f00,2px 2px #000}.miniBossBg{height:15px;background:#200404;border:2px solid #000;border-radius:4px;overflow:hidden}.miniBossFill{height:100%;width:100%;background:linear-gradient(90deg,#8a0000,#ff1414 55%,#ff5a3d);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hpWrap">
    <div id="hpBarBg"><div id="hpBar"></div></div>

  </div>
  <div id="dashWrap">

  </div>
  <div id="streakText">Streak: 0 &nbsp;•&nbsp; Kills: 0</div>
  <div id="bossBarWrap">
    <div id="bossName">MUTATED GREEN</div>
    <div id="bossBarBg"><div id="bossBar"></div></div>
  </div>
  <div id="multiBossBars">
    <div class="miniBossRow"><div class="miniBossName" id="cubeBossName0">CUBE V2</div><div class="miniBossBg"><div class="miniBossFill" id="cubeBossBar0"></div></div></div>
    <div class="miniBossRow"><div class="miniBossName" id="cubeBossName1">FAKE CUBE</div><div class="miniBossBg"><div class="miniBossFill" id="cubeBossBar1"></div></div></div>
    <div class="miniBossRow"><div class="miniBossName" id="cubeBossName2">FAKE CUBE</div><div class="miniBossBg"><div class="miniBossFill" id="cubeBossBar2"></div></div></div>
  </div>
  <div id="banner"></div>
  <div id="calibText"></div><div id="parryPulse"></div>
</div>
<div id="deathScreen">
  <h1>YOU DIED</h1>
  <p id="finalStats"></p>
  <button onclick="restartGame()">TRY AGAIN</button>
</div>
<div id="mainMenu">
  <div id="menuStack">
    <button id="playBtn" class="bigBtn">PLAY</button>
    <button id="settingsBtn" class="bigBtn">SETTINGS</button>
    <div id="diffCorner">
      <button id="diffToggleBtn">DIFFICULTY: NORMAL</button>
      <div id="diffOptions">
        <button class="diffBtn" data-diff="easy">EASY</button>
        <button class="diffBtn active" data-diff="normal">NORMAL</button>
        <button class="diffBtn" data-diff="brutal">BRUTAL</button>
      </div>
    </div>
  </div>
</div>
<button id="bossStagesBtn" class="bigBtn">BOSS STAGES</button>
<div id="settingsScreen"><div id="settingsPanel">
  <h2>SETTINGS</h2>
  <div class="settingRow"><span><span style="color:#fff">PARRY VOLUME</span></span><input id="parryVolume" type="range" min="0" max="100"></div>
  <div class="settingRow"><span><span style="color:#fff">MUSIC VOLUME</span></span><input id="musicVolume" type="range" min="0" max="100"></div>
  <div class="settingRow"><span><span style="color:#fff">SFX VOLUME</span></span><input id="sfxVolume" type="range" min="0" max="100"></div>
  <button id="closeSettingsBtn" class="bigBtn">BACK</button>
</div></div>
<div id="stageSelect">
  <h1>STAGES</h1>
  <div id="stageGrid">
    <div id="stage1Card" class="stageCard">
      <div class="completedBadge" id="stage1Badge">✓ COMPLETED</div>
      <canvas class="stageThumb" id="thumb1" width="300" height="160"></canvas>
      <div class="stageCardTitle">ME</div>
    </div>
  </div>
  <button id="stageBackBtn" class="bigBtn" style="margin-top:32px;">BACK</button>
</div>

    <div id="cubeV2BossCard" class="stageCard">
      <canvas class="stageThumb" id="bossThumbCube" width="300" height="160"></canvas>
      <div class="stageCardTitle">CUBE V2</div>
    </div>
  </div>

</div>

  <h1 id="stageCompleteTitle">STAGE COMPLETE</h1>
  <p id="stageCompleteStats"></p>

<script>
/* ======================================================================
   MINI ULTRAKILL - 2D top-down action game
   Images are loaded from the images/ folder. Falls back to placeholders
   if a file is missing, so the game still runs.
   ====================================================================== */

// ---------- CANVAS SETUP ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  // Keep pixel-art / low-res assets sharp when scaled.
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// ---------- GUN ROTATION CONFIG ----------
// gun.png points WEST (left) when its rotation is 0.
// The aiming angle is measured from EAST, so WEST-facing art needs +PI.
// Keeping this as one fixed transform prevents flip/rotation glitches.
const GUN_ART_OFFSET = Math.PI;
// ---------- IMAGE LOADER (with fallback) ----------
function loadImg(path){
  const img = new Image();
  img.loaded = false;
  img.src = path;
  img.onload = () => { img.loaded = true; };
  img.onerror = () => { img.loaded = false; };
  return img;
}

const IMG = {
  map:    loadImg('images/Map.png'),
  map2:   loadImg('images/map2.png'),
  nice:   loadImg('images/nice.png'),
  mid:    loadImg('images/mid.png'),
  angry:  loadImg('images/angry.png'),
  green:  loadImg('images/Green.png'),
  glob:   loadImg('images/Glob.png'),
  gun:    loadImg('images/gun.png'),
  shotgun: loadImg('images/shotgun.png'),
  bullet: loadImg('images/bullet.png'),
  orb:    loadImg('images/yellow-orb.png'), // rename/adjust this path if your file is named differently
  explosion: loadImg('images/explosion.png'),
  knight: loadImg('images/knight.png'),
  sword:  loadImg('images/sword.png'),
  hard:   loadImg('images/hard.png'), // legacy fallback
  angry:  loadImg('images/angry.png'),
};

// ---------- SOUND EFFECTS ----------
const SFX = {
  dash:      new Audio('musics/dash.mp3'),
  heal:      new Audio('musics/heal.mp3'),
  explosion: new Audio('musics/explosion.mp3'),
  shotgun:   new Audio('musics/shotgun.mp3'),
  shoot:     new Audio('musics/shoot.mp3'),
  parry:     new Audio('musics/parry.mp3'),
};
// Plays a sound effect, allowing overlapping instances (cloning the node)
// so rapid-fire shots/explosions don't cut each other off. Fails silently
// if the file is missing or the browser blocks autoplay.
let masterSfxVolume = Number(localStorage.getItem('kt_sfx_volume') ?? 0.65);
let parryVolume = Number(localStorage.getItem('kt_parry_volume') ?? 0.70);
let musicVolume = Number(localStorage.getItem('kt_music_volume') ?? 0.55);
function playSFX(audio, volume=0.65){
  try{
    const inst = audio.cloneNode();
    inst.volume = Math.max(0,Math.min(1,volume * masterSfxVolume));
    const p = inst.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

// placeholder-drawing helper (used when an image failed to load)
function drawPlaceholder(x, y, w, h, color, label, rot){
  ctx.save();
  ctx.translate(x, y);
  if(rot) ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-w/2,-h/2,w,h,6) : ctx.rect(-w/2,-h/2,w,h);
  ctx.fill(); ctx.stroke();
  if(label){
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 0);
  }
  ctx.restore();
}

// helper that draws an image rotated around its center
function drawRotatedImage(img, x, y, w, h, rot, placeholderColor, placeholderLabel){
  if(img.loaded){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();
  } else {
    drawPlaceholder(x, y, w, h, placeholderColor, placeholderLabel, rot || 0);
  }
}

// ---------- WORLD / CAMERA ----------
// World is always scaled up to be comfortably larger than the viewport
// (so there's real WASD-scrollable space) and the map image is stretched
// to exactly cover the world bounds - no black gaps, ever.
const WORLD = { w: 3200, h: 2200 };
function fitWorldToMapImg(img){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if(nw < 10 || nh < 10) return;
  // minimum world size: at least ~2.5x the current viewport in both axes
  const minW = canvas.width * 2.5;
  const minH = canvas.height * 2.5;
  const scale = Math.max(1, minW / nw, minH / nh);
  WORLD.w = Math.round(nw * scale);
  WORLD.h = Math.round(nh * scale);
  // keep the player centered in the (re)sized world
  player.x = WORLD.w / 2;
  player.y = WORLD.h / 2;
}
// Stage 1 uses Map.png, Stage 2 uses map2.png.
function currentMapImg(){
  return currentStage === 2 ? IMG.map2 : IMG.map;
}
IMG.map.onload = () => {
  IMG.map.loaded = true;
  if(currentStage === 1) fitWorldToMapImg(IMG.map);
};
IMG.map2.onload = () => {
  IMG.map2.loaded = true;
  if(currentStage === 2) fitWorldToMapImg(IMG.map2);
};

const camera = { x: 0, y: 0 };
function updateCamera(){
  camera.x = clamp(player.x - canvas.width/2, 0, Math.max(0, WORLD.w - canvas.width));
  camera.y = clamp(player.y - canvas.height/2, 0, Math.max(0, WORLD.h - canvas.height));
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

function tryParry(){
  if(!player.alive || parryCooldown > 0) return;

  // Knight sword: parry the thrown sword. Knights do NOT reflect yellow orbs.
  let swordParried = false;
  const swordParryRange = 110 * DIFF.parryRangeMult;
  for(const sp of swordProjectiles){
    if(sp.parried) continue;
    if(dist(sp.x,sp.y,player.x,player.y) <= swordParryRange){
      const mw = mouseWorld();
      const aim = Math.atan2(mw.y-player.y, mw.x-player.x);
      const speed = Math.max(1100, Math.hypot(sp.vx,sp.vy)*1.25);
      sp.x = player.x; sp.y = player.y;
      sp.vx = Math.cos(aim)*speed;
      sp.vy = Math.sin(aim)*speed;
      sp.angle = aim;
      sp.owner = 'player';
      sp.parried = true;
      sp.dmg = 110 * DIFF.playerDmgMult;
      swordParried = true;
      lastParriedOrbPos = {x:sp.x,y:sp.y};
      player.hp = player.maxHp;
      spawnExplosion(sp.x,sp.y,0.65);
    }
  }

  // Cube V2 gun bullets are normal parryable projectiles.
  let cubeBulletParried = false;
  const cubeBulletParryRange = 112 * DIFF.parryRangeMult;
  for(const cb of cubeBullets){
    if(cb.parried) continue;
    if(dist(cb.x,cb.y,player.x,player.y) <= cubeBulletParryRange){
      const mw = mouseWorld();
      const aim = Math.atan2(mw.y-player.y, mw.x-player.x);
      const speed = Math.max(1100, Math.hypot(cb.vx,cb.vy)*1.45);
      cb.x = player.x; cb.y = player.y;
      cb.vx = Math.cos(aim)*speed; cb.vy = Math.sin(aim)*speed;
      cb.owner = 'player'; cb.parried = true;
      cb.dmg = 115 * DIFF.playerDmgMult;
      cubeBulletParried = true;
      lastParriedOrbPos = {x:cb.x,y:cb.y};
      player.hp = player.maxHp;
      spawnExplosion(cb.x,cb.y,0.55);
    }
  }

  // Shotgun mermisini parryleyince mermi kaybolmaz: bulunduğu yerde patlar ve düz devam eden 2x hasarlı patlayıcı mermi olur.
  let shotgunParried = false;
  const shotgunParryRange = 105 * DIFF.parryRangeMult;
  for(const b of bullets){
    if(b.type !== 'shotgun' || b.parriedExplosive) continue;
    if(dist(b.x,b.y,player.x,player.y) <= shotgunParryRange){
      spawnExplosion(b.x,b.y,1.15);
      b.parriedExplosive=true;
      b.explosive=true;
      b.dmgMultiplier=2;
      b.explosionRadius=125;
      b.explosionDamage=120*DIFF.playerDmgMult;

      // Parrylenen shotgun pellet artık spread açısını korumaz:
      // mouse'un tam yönüne, dümdüz gider.
      const mw = mouseWorld();
      const parryAim = Math.atan2(mw.y - player.y, mw.x - player.x);
      const parrySpeed = 1050;
      b.vx = Math.cos(parryAim) * parrySpeed;
      b.vy = Math.sin(parryAim) * parrySpeed;
      shotgunParried=true;
    }
  }

  let parried = false;
  const range = 88 * DIFF.parryRangeMult;

  // Knight thrown swords
  for(const sp of swordProjectiles){
    const sx=sp.x-camera.x, sy=sp.y-camera.y;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(sp.angle||0);
    ctx.shadowColor=sp.parried?'#fff06a':'#e8f4ff';
    ctx.shadowBlur=sp.parried?22:14;
    if(IMG.sword.loaded) ctx.drawImage(IMG.sword,-34,-10,68,20);
    else {ctx.fillStyle=sp.parried?'#fff06a':'#dce8f2';ctx.fillRect(-34,-5,68,10);}
    ctx.restore();
  }

  for(const o of orbs){
    if(o.parried) continue;

    if(dist(o.x,o.y,player.x,player.y) <= range){
      const mw = mouseWorld();
      const aim = Math.atan2(mw.y - player.y, mw.x - player.x);

      // Mouse yönündeki en uygun düşmanı kilitle.
      let target = null;
      let bestScore = Infinity;
      for(const e of enemies){
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const d = Math.hypot(dx,dy);
        if(d > 1100) continue;

        const enemyAngle = Math.atan2(dy,dx);
        const angleDiff = Math.abs(Math.atan2(
          Math.sin(enemyAngle-aim), Math.cos(enemyAngle-aim)
        ));

        if(angleDiff < Math.PI*0.48*DIFF.parryAngleMult){
          const score = angleDiff * 700 + d * 0.22;
          if(score < bestScore){
            bestScore = score;
            target = e;
          }
        }
      }

      const speed = Math.max(1050, Math.hypot(o.vx,o.vy) * 2.0);

      o.x = player.x;
      o.y = player.y;
      lastParriedOrbPos = {x:o.x, y:o.y};
      o.vx = Math.cos(aim) * speed;
      o.vy = Math.sin(aim) * speed;
      o.owner = 'player';
      o.parried = true;
      o.dmg = 100 * DIFF.playerDmgMult;
      o.target = target;
      o.homing = !!target;

      // Başarılı parry = can full.
      player.hp = player.maxHp;
      parried = true;
    }
  }

  if(shotgunParried){
    parryPulse.x = player.x; parryPulse.y = player.y; parryPulse.active = true;
    parryPulseTimer = 0.38;
  }

  if(parried){
    parryPulseTimer = 0.38;
    // Pulse artık ekranın merkezinden değil, parrylenen orbun GERÇEK konumundan çıkar.
    if(lastParriedOrbPos){
      parryPulse.x = lastParriedOrbPos.x;
      parryPulse.y = lastParriedOrbPos.y;
      parryPulse.active = true;
    }
  }

  // Whiff (nothing in range) = no lockout at all, so spamming F while
  // waiting for the next orb never costs you a beat. A real parry only
  // gets a tiny cooldown, just long enough to stop one press registering
  // twice in the same frame - short enough that fast, back-to-back orbs
  // (like the boss's 5-orb burst) can each still be parried in turn.
  if(parried || shotgunParried || swordParried || cubeBulletParried){
    parryCooldown = 0.08;
    if(!autoPilot) playSFX(SFX.parry, parryVolume);
  }
}

// Drives the player like a simple bot while the main menu / stages intro
// is showing, so there's live gameplay happening behind those screens.
// Returns the normalized movement vector for this frame; also fakes the
// mouse aim (via mouseScreen, which mouseWorld()/shoot()/drawPlayer()
// already read) and fires/dashes/switches weapons on its own timers.
function updateAutoPilot(dt){
  // pick the nearest enemy to fight
  let target = null, bestD = Infinity;
  for(const e of enemies){
    const d = dist(player.x, player.y, e.x, e.y);
    if(d < bestD){ bestD = d; target = e; }
  }

  // Mouse-like smooth aiming: smoothly rotate toward the target instead of snapping.
  // The exponential blend keeps it smooth at every FPS while still eventually becoming accurate.
  if(target){
    const desiredAngle = Math.atan2(target.y - player.y, target.x - player.x);
    const angleDiff = Math.atan2(
      Math.sin(desiredAngle - botAimAngle),
      Math.cos(desiredAngle - botAimAngle)
    );
    const aimSmooth = 1 - Math.exp(-4.2 * dt);
    botAimAngle += angleDiff * aimSmooth;
  } else {
    botAimAngle += dt * 0.32;
  }

  // fake the mouse so mouseWorld()/shoot()/drawPlayer() all just work
  mouseScreen.x = canvas.width/2 + Math.cos(botAimAngle) * 140;
  mouseScreen.y = canvas.height/2 + Math.sin(botAimAngle) * 140;

  // parry incoming yellow orbs on reaction - checked every frame so it
  // catches them one at a time as they arrive, no matter how fast
  for(const o of orbs){
    if(o.parried) continue;
    if(dist(o.x, o.y, player.x, player.y) <= 150){
      tryParry();
      break;
    }
  }

  // movement: hold a mid-range distance, strafing, back off if something
  // gets too close, otherwise close the distance
  let mv = { x:0, y:0 };
  botStrafeTimer -= dt;
  if(botStrafeTimer <= 0){ botStrafeDir *= -1; botStrafeTimer = 1.2 + Math.random()*1.4; }

  if(target){
    if(bestD < 160){
      mv.x = -Math.cos(botAimAngle); mv.y = -Math.sin(botAimAngle);
    } else if(bestD > 380){
      mv.x = Math.cos(botAimAngle); mv.y = Math.sin(botAimAngle);
    } else {
      mv.x = Math.cos(botAimAngle + Math.PI/2) * botStrafeDir;
      mv.y = Math.sin(botAimAngle + Math.PI/2) * botStrafeDir;
    }
  } else {
    mv.x = Math.cos(botAimAngle);
    mv.y = Math.sin(botAimAngle);
  }

  // Keep the menu demo character around the middle instead of letting it camp corners.
  const cx=WORLD.w/2, cy=WORLD.h/2;
  const dcx=cx-player.x, dcy=cy-player.y, centerDist=Math.hypot(dcx,dcy)||1;
  if(centerDist>420){
    const pull=Math.min(1,(centerDist-420)/500);
    mv.x = mv.x*(1-pull*0.72) + (dcx/centerDist)*(pull*1.15);
    mv.y = mv.y*(1-pull*0.72) + (dcy/centerDist)*(pull*1.15);
  }
  // smooth the movement vector itself so direction changes ease in/out
  // instead of instantly flipping - feels far less twitchy/robotic
  const moveSmooth = Math.min(1, dt * 7);
  botMoveX += (mv.x - botMoveX) * moveSmooth;
  botMoveY += (mv.y - botMoveY) * moveSmooth;

  // shooting
  botFireTimer -= dt;
  if(target && botFireTimer <= 0){
    shoot();
    botFireTimer = weapon==='shotgun' ? 0.86 : 0.35;
  }

  // dashing away every so often when things get hairy
  botDashTimer -= dt;
  if(botDashTimer <= 0 && target && bestD < 220){
    tryDash();
    botDashTimer = 1.4 + Math.random()*1.2;
  }

  // occasionally swap weapons just to show both off
  botWeaponTimer -= dt;
  if(botWeaponTimer <= 0){
    weapon = weapon === 'gun' ? 'shotgun' : 'gun';
    botWeaponTimer = 4 + Math.random()*4;
  }

  return { x: botMoveX, y: botMoveY };
}

// ---------- BULLETS (player) ----------
let bullets = [];
let swordProjectiles = [];
let cubeBullets = [];
function shoot(){
  if(player.fireCooldown > 0 || !player.alive) return;
  const mw = mouseWorld();
  const ang = Math.atan2(mw.y - player.y, mw.x - player.x);
  const muzzleDist = player.radius + 18;
  if(weapon === 'shotgun'){
    player.fireCooldown = player.shotgunRate;
    if(!autoPilot) playSFX(SFX.shotgun, 0.7);
    // 3 pellets: gerçek shotgun gibi her pellet farklı bir yöne açılır.
    // Hepsi aynı namlu noktasından çıkar; sadece uçuş açıları farklıdır.
    // Böylece mermiler yan yana paralel gitmez, ilerledikçe yayılır.
    const spreadAngles = [-0.18, 0, 0.18]; // yaklaşık ±10.3°
    for(const spread of spreadAngles){
      const pelletAng = ang + spread;
      bullets.push({
        x:player.x+Math.cos(pelletAng)*muzzleDist,
        y:player.y+Math.sin(pelletAng)*muzzleDist,
        vx:Math.cos(pelletAng)*690,
        vy:Math.sin(pelletAng)*690,
        dmg:22*DIFF.playerDmgMult,
        type:'shotgun',
        spawnX:player.x,
        spawnY:player.y,
        parriedExplosive:false, explosive:false, dmgMultiplier:1,
        spreadAngle:spread
      });
    }
  } else {
    player.fireCooldown = player.fireRate;
    if(!autoPilot) playSFX(SFX.shoot, 0.55);
    bullets.push({x:player.x+Math.cos(ang)*muzzleDist,y:player.y+Math.sin(ang)*muzzleDist,vx:Math.cos(ang)*780,vy:Math.sin(ang)*780,dmg:22*DIFF.playerDmgMult,type:'gun'});
  }
}
